<div class="authentication-wrapper authentication-2 ui-bg-cover ui-bg-overlay-container px-4" style="background-image: url('assets/img/bg/1.jpg');">
  <div class="ui-bg-overlay bg-dark opacity-25"></div>

  <div class="authentication-inner py-5">

    <div class="card">
      <div class="p-4 p-sm-5">
        <!-- Logo -->
        <div class="d-flex justify-content-center align-items-center pb-2 mb-2">
          <div class="ui-w-120">
            <div class="w-100 position-relative" style="padding-bottom: 4%">
                <img src="assets/img/logo1.jpg" class="img-fluid">
            </div>
          </div>
        </div>
        <!-- / Logo -->
        <h5 class="text-center text-dark font-weight-normal mb-4">Forgot Password</h5>
        <!-- Form -->
        <form class="bs-example form-horizontal" [formGroup]="forgotPassword" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input #email type="text" class="form-control border-bot" placeholder="Enter Email" formControlName="email">
            <div class="col-md-12" *ngIf="submitted && f.email.errors" class="invalid-feedback">
                <label *ngIf="f.email.errors.required">Email is required</label>
              </div>
          </div>
         
          <div class="d-flex justify-content-between align-items-center m-0">
            <button type="submit" class="btn btn-primary">Send</button>
          </div>

          <div class="form-group d-flex justify-content-center">Do you remember your password?
            <a [routerLink]="[loginUrl]" class="mr-1 forget">&nbsp; Login</a>
        </div> 
        </form>
        <!-- / Form -->
      </div>
    </div>
  </div>
</div>
