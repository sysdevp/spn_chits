<div class="spn-login-page">
  <div class="spn-login-brand">
    <img src="assets/img/spn-logo.png" alt="SRI SPN Chit Funds" class="spn-login-logo">
    <h1 class="spn-login-brand-title">SRI SPN CHIT FUNDS</h1>
    <p class="spn-login-brand-subtitle">Private Limited</p>
    <p class="spn-login-tagline">Secure &bull; Transparent &bull; Trusted</p>
  </div>

  <div class="spn-login-panel">
    <div class="spn-login-card">
      <img src="assets/img/spn-logo.png" alt="SRI SPN Chit Funds" class="spn-login-card-logo">

      <h2 class="spn-login-heading">Forgot password</h2>
      <p class="spn-login-subtitle">Enter your email and we will send reset instructions</p>

      <form class="spn-login-form" [formGroup]="forgotPassword" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input
            #email
            type="text"
            class="form-control"
            placeholder="Enter your email"
            formControlName="email"
            autocomplete="email">
          <div class="col-md-12" *ngIf="submitted && f.email.errors" class="invalid-feedback">
            <label *ngIf="f.email.errors.required">Email is required</label>
          </div>
        </div>

        <button type="submit" class="spn-login-submit">Send reset link</button>

        <p class="spn-login-footer-text mt-3 mb-0">
          Remember your password?
          <a [routerLink]="['/']" class="ml-1" style="color: #9a7b2e;">Sign in</a>
        </p>
      </form>
    </div>
  </div>
</div>
