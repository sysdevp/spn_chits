          </ul>
          </li>
          
            <li class="nav-item dropdown" *ngIf="showAccountsMenu"><a class="nav-link text-white" href="#" data-toggle="dropdown">Accounts<i class="fa fa-angle-down"></i></a>
              <ul class="dropdown-menu" role="menu">
               <li *ngFor="let item of accountsItems"><a [routerLink]="['/admin-panel', item.route]">{{ item.label }}</a></li>
              </ul>
              </li>
