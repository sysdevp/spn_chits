<nav class="spn-internal-header">
  <button type="button" class="spn-menu-btn" (click)="toggleSidenav()" title="Menu">
    <i class="ion ion-md-menu"></i>
  </button>

  <div class="spn-header-search">
    <app-customer-history-search variant="navbar" [compact]="true" placeholder="Search by name / mobile / customer code / AR No..."></app-customer-history-search>
  </div>

  <div class="spn-header-right">
    <div class="spn-branch">
      <i class="fas fa-map-marker-alt"></i>
      <select [value]="headerBranchId" (change)="onHeaderBranch($event)" aria-label="Branch">
        <option value="0">All Branches</option>
        <option *ngFor="let b of headerBranches" [value]="b.id">{{ b.branch_name }}</option>
      </select>
    </div>

    <div class="spn-date">
      <i class="far fa-calendar-alt"></i>
      <span>
        <b>{{ headerDate }}</b>
        <small>{{ headerDay }}</small>
      </span>
    </div>

    <div ngbDropdown [placement]="isRTL ? 'bottom-left' : 'bottom-right'" (openChange)="$event && loadNotifications()">
      <button type="button" ngbDropdownToggle class="spn-bell" title="Notifications">
        <i class="far fa-bell"></i>
        <span class="spn-bell-count" *ngIf="notif.total">{{ notif.total > 99 ? '99+' : notif.total }}</span>
      </button>
      <div ngbDropdownMenu class="spn-notif" [class.dropdown-menu-right]="!isRTL">
        <div class="spn-notif-head">Notifications <a href="javascript:void(0)" (click)="loadNotifications()"><i class="fa fa-refresh"></i></a></div>

        <div class="spn-notif-sec" *ngIf="notif.tasks?.length">Today's tasks</div>
        <a *ngFor="let t of notif.tasks" class="spn-notif-item" [routerLink]="['/admin-panel', t.route]">
          <i class="fa fa-check-square-o" [class.text-danger]="t.overdue"></i>
          <span><b>{{ t.title }}</b><small [class.text-danger]="t.overdue">{{ t.sub }}</small></span>
        </a>

        <div class="spn-notif-sec" *ngIf="notif.targets?.length">Today's targets</div>
        <a *ngFor="let t of notif.targets" class="spn-notif-item" [routerLink]="['/admin-panel', t.route]">
          <i class="fa fa-bullseye"></i>
          <span><b>{{ t.title }}</b><small>{{ t.sub }}</small>
            <span class="spn-notif-bar"><span [style.width.%]="t.pct > 100 ? 100 : t.pct"></span></span></span>
        </a>

        <div class="spn-notif-sec" *ngIf="notif.approvals?.length">Approvals &amp; requests</div>
        <a *ngFor="let a of notif.approvals" class="spn-notif-item" [routerLink]="['/admin-panel', a.route]">
          <i class="fa fa-gavel"></i>
          <span><b>{{ a.title }}</b></span>
          <em>{{ a.count }}</em>
        </a>

        <div class="spn-notif-empty" *ngIf="!notif.tasks?.length && !notif.targets?.length && !notif.approvals?.length">
          You're all caught up.
        </div>
        <a class="spn-notif-foot" [routerLink]="['/admin-panel/office-tickets']">Office tickets &amp; wishes →</a>
      </div>
    </div>

    <div ngbDropdown [placement]="isRTL ? 'bottom-left' : 'bottom-right'" class="demo-navbar-user">
      <button type="button" ngbDropdownToggle class="spn-profile">
        <img [src]="profileImg" alt="">
        <span>
          <b>{{ loggedUserName || 'Admin' }}</b>
          <small>{{ roleLabel }}</small>
        </span>
        <i class="fas fa-chevron-down" style="font-size:10px;color:#64748B;"></i>
      </button>
      <div ngbDropdownMenu [class.dropdown-menu-right]="!isRTL">
        <a [routerLink]="['/admin-panel/password-change']" class="dropdown-item">Change Password</a>
        <a [routerLink]="['/logout']" class="dropdown-item">Log Out</a>
      </div>
    </div>
  </div>
</nav>
