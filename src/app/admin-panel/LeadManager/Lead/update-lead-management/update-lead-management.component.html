<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Update Lead</div>
      <div class="col-6 text-right">
        <a
          [routerLink]="['/admin-panel/view-lead-management']"
          class="bg-info border-0 text-white px-3 py-2"
        >
          <i class="fas fa-eye pr-2"></i> View Lead</a
        >
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form
      class="bs-example form-horizontal"
      [formGroup]="UpdateLeadManagement"
      (ngSubmit)="onSubmit()"
    >
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label"
          >Company Name <span class="error">*</span></label
        >
        <div class="col-sm-10">
          <select
            #tenant_id
            formControlName="tenant_id"
            (change)="companyChg($event)"
            disabled
          >
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{ data.id }}">
              {{ data.chit_fund_name }}
            </option>
          </select>
          <div
            class="col-md-12"
            *ngIf="submitted && f.tenant_id.errors"
            class="invalid-feedback"
          >
            <label *ngIf="f.tenant_id.errors.required"
              >Company is required</label
            >
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Branch Name <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select
                #branch_id
                formControlName="branch_id"
                (change)="branchChg($event)"
                disabled
              >
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{ data.id }}">
                  {{ data.branch_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.branch_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.branch_id.errors.required"
                  >Branch is required</label
                >
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Employee Name</label>
            <div class="col-sm-8">
              <select #employee_id formControlName="employee_id" disabled>
                <option value="">Select Employee</option>
                <option *ngFor="let data of employeeList" value="{{ data.id }}">
                  {{ data.first_name }} {{ data.last_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.employee_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.employee_id.errors.required"
                  >Employee is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Lead Customer Name <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #lead_customer_name
                type="text"
                class="form-control"
                placeholder="Enter Customer Name"
                formControlName="lead_customer_name"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.lead_customer_name.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.lead_customer_name.errors.required"
                  >Customer name is required</label
                >
                <label *ngIf="f.lead_customer_name.errors.pattern"
                  >Invalid format</label
                >
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Phone No</label>
            <div class="col-sm-8">
              <input
                #phone_no
                type="text"
                class="form-control"
                placeholder="Enter Phone Number"
                formControlName="phone_no"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.phone_no.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.phone_no.errors.pattern">Invalid format</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Mobile No</label>
            <div class="col-sm-8">
              <input
                #mobile_no
                type="text"
                class="form-control"
                placeholder="Enter Mobile Number"
                formControlName="mobile_no"
                (input)="onKeyUpMobile($event)"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.mobile_no.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.mobile_no.errors.required"
                  >Mobile no is required</label
                >
                <label *ngIf="f.mobile_no.errors.pattern"
                  >Invalid mobile number</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Email</label>
            <div class="col-sm-8">
              <input
                #email_id
                type="text"
                class="form-control"
                placeholder="Enter Email"
                formControlName="email_id"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.email_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.email_id.errors.required"
                  >Email is required</label
                >
                <label *ngIf="f.email_id.errors.pattern">Invalid format</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Address Line  - 1</label>
            <div class="col-sm-8">
              <input
                #address_line_1
                type="text"
                class="form-control"
                placeholder="Enter Address Line  - 1"
                formControlName="address_line_1"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.address_line_1.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.address_line_1.errors.required"
                  >Address Line  - 1 is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Address Line  - 2</label>
            <div class="col-sm-8">
              <input
                #address_line_2
                type="text"
                class="form-control"
                placeholder="Enter Address Line  - 2"
                formControlName="address_line_2"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.address_line_2.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.address_line_2.errors.required"
                  >Address Line  - 2 is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Land Mark</label>
            <div class="col-sm-8">
              <input
                #landmark
                type="text"
                class="form-control"
                placeholder="Enter Land Mark"
                formControlName="landmark"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.landmark.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.landmark.errors.required"
                  >Land mark is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">State</label>
            <div class="col-sm-8">
              <select
                #state_id
                formControlName="state_id"
                (change)="stateChg($event)"
              >
                <option value="">Select State</option>
                <option *ngFor="let data of stateList" value="{{ data.id }}">
                  {{ data.state_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.state_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.state_id.errors.required"
                  >State is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">District</label>
            <div class="col-sm-8">
              <select
                #district_id
                formControlName="district_id"
                (change)="districtChg($event)"
              >
                <option value="">Select District</option>
                <option *ngFor="let data of districtList" value="{{ data.id }}">
                  {{ data.district_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.district_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.district_id.errors.required"
                  >District is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">City</label>
            <div class="col-sm-8">
              <select #city_id formControlName="city_id">
                <option value="">Select City</option>
                <option *ngFor="let data of cityList" value="{{ data.id }}">
                  {{ data.city_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.city_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.city_id.errors.required"
                  >City is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Pincode</label>
            <div class="col-sm-8">
              <input
                #pincode
                type="text"
                class="form-control"
                placeholder="Enter Pincode"
                formControlName="pincode"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.pincode.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.pincode.errors.pattern">Invalid format</label>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Source Type <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select #source_type_id formControlName="source_type_id">
                <option value="">Select Source Type</option>
                <option
                  *ngFor="let data of sourceTypeList"
                  value="{{ data.id }}"
                >
                  {{ data.source_type_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.source_type_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.source_type_id.errors.required"
                  >Source Type is required</label
                >
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Followup Status </label>
            <div class="col-sm-8">
              <select
                #followup_status_type_id
                formControlName="followup_status_type_id"
              >
                <option value="">Select Followup Status</option>
                <option
                  *ngFor="let data of followupstatusList"
                  value="{{ data.id }}"
                >
                  {{ data.followup_status_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.followup_status_type_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.followup_status_type_id.errors.required"
                  >Followup Status is required</label
                >
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group row d-flex justify-content-center">
        <button
          type="submit"
          class="btn btn-primary mr-1"
          [disabled]="disableBtn"
        >
          {{ SubmitbuttonName }}
        </button>
        <a
          [routerLink]="['/admin-panel/view-lead-management']"
          class="btn btn-danger mr-1"
          >Cancel</a
        >
      </div>
    </form>
  </div>
</div>
