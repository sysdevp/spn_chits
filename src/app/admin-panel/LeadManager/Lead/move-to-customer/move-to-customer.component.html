<ng-template #uploadModal let-c="close" let-d="dismiss">
  <div class="modal-header without-text d-flex p-2">
    <h4 class="mb-0 my-auto text-white px-3">Upload File</h4>
    <button type="button" class="btn btn-default mx-2 text-white border-white px-3 py-2 rounded-circle" id="myDiv" style="color:#000;" (click)="c('Close click');uploader.clearQueue()">X</button>
  </div>
  <div class="ng2-file-upload-drop-zone text-center py-2 px-3" style="border-bottom: 1px solid #8897aa;margin: 10px;"
    ng2FileDrop
    [ngClass]="{'ng2-file-upload-file-over': hasBaseDropZoneOver}"
    (fileOver)="fileOver($event)"
    [uploader]="uploader">
    <div class="row">    
      <div class="col-md-12 col-12 d-flex justify-content-center">
        <label class="btn btn-secondary mr-2">Select file
          <input type="file" class="sr-only" ng2FileSelect [uploader]="uploader" accept="image/*">
        </label>
        <div class="mr-3 text-center service_up">
          <button type="button" class="progress-resume-link btn btn-primary" (click)="uploadFileDetails(uploader.queue);c('Close click');uploader.clearQueue()"
            [disabled]="!uploader.getNotUploadedItems().length" ngbTooltip="Upload all">
            <i class="icon ion-md-cloud-upload px-2"></i> Upload File</button>
       </div>
      </div>
    </div>
  </div>
  <div class="media mt-4" [class.d-none]="!uploader?.queue?.length">
    <div class="row" style="width: 100%;"> 
      <div class="col-md-12">
        <div class="media-body align-self-center" style="margin-top: 13px;"> 
          <div class="progress-container progress">
            <div class="progress-bar" [ngStyle]="{ 'width': uploader.progress + '%' }"></div>
          </div>
        </div>
      </div>
      <div class="col-md-12">
        <ul class="list-group mt-4" [class.d-none]="!uploader?.queue?.length" >
          <li class="list-group-item" *ngFor="let item of uploader.queue; let i = index;"> 
            <div class="media">
              <div class="media-body">
                <div style="width: 60%;float:left;">
                  <span *ngIf="item.isSuccess"><i class="ion ion-md-checkmark text-success text-big mr-2"></i></span> 
                  <span *ngIf="item.isError"><i class="ion ion-md-alert text-danger text-big mr-2"></i></span>
                  <strong>File {{ item?.file?.name }}</strong>
                  <span>- <em class="text-muted">{{ item.progress + '%' }}</em></span>
                  <small class="text-muted" nowrap>
                  {{ item?.file?.size/1024/1024 | number:'.2' }} MB
                  </small>
                </div>
              </div>
              <div class="align-self-center ml-3">
                <button type="button" class="btn btn-sm icon-btn btn-outline-danger" (click)="item.remove()"><i class="ion ion-md-trash"></i></button>
              </div>
            </div> 
          </li>
        </ul>
      </div>
    </div>
  </div> 
</ng-template>

          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>

        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Source Of Funds</label>
            <div class="col-sm-8">
              <input #source_of_funds type="text" class="form-control" placeholder="Enter Source Of Funds" formControlName="source_of_funds">
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Income</label>
            <div class="col-sm-8">
              <input #income type="text" class="form-control" placeholder="Enter Income" formControlName="income">
              <div class="col-md-12" *ngIf="submitted && f.income.errors" class="invalid-feedback">
                <label *ngIf="f.income.errors.pattern">Invaild Format</label>
              </div>    
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Customer Bonus</label>
            <div class="col-sm-8">
              <input #customer_bonus type="text" class="form-control" placeholder="Enter Customer Bonus" formControlName="customer_bonus">
              <div class="col-md-12" *ngIf="submitted && f.customer_bonus.errors" class="invalid-feedback">
                <label *ngIf="f.customer_bonus.errors.pattern">Invaild Format</label>
              </div>  
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Relationship</label>
            <div class="col-sm-8">
              <select #relationship_id formControlName="relationship_id">
                <option value="">Select Relationship</option>
                <option *ngFor="let data of relationshipList" value="{{data.id}}">{{data.relationship_name}}</option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Customer Belongs To</label>
            <div class="col-sm-8">
              <select #customer_belongs_to  formControlName="customer_belongs_to">
                <option value="">Select Customer</option>
                <option *ngFor="let data of customerList" value="{{data.id}}">{{data.name}}</option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Customer Penalty</label>
            <div class="col-sm-8">
              <input #customer_penalty_interest type="text" class="form-control" placeholder="Enter Customer Penalty Interest" formControlName="customer_penalty_interest">
              <div class="col-md-12" *ngIf="submitted && f.customer_penalty_interest.errors" class="invalid-feedback">
                <label *ngIf="f.customer_penalty_interest.errors.pattern">Invaild Format</label>
              </div>    
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Customer Interest</label>
            <div class="col-sm-8">
              <input #customer_interest type="text" class="form-control" placeholder="Enter Customer Penalty Interest" formControlName="customer_interest">
              <div class="col-md-12" *ngIf="submitted && f.customer_interest.errors" class="invalid-feedback">
                <label *ngIf="f.customer_interest.errors.pattern">Invaild Format</label>
              </div> 
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Customer Dividend</label>
            <div class="col-sm-8">  
              <input #customer_divident type="text" class="form-control" placeholder="Enter Customer Dividend" formControlName="customer_divident">
              <div class="col-md-12" *ngIf="submitted && f.customer_divident.errors" class="invalid-feedback">
                <label *ngIf="f.customer_divident.errors.pattern">Invaild Format</label>
              </div> 
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Sms</label>
            <div class="col-sm-8 my-auto">
              <input #sms type="checkbox" formControlName="sms">
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Is Guarantor</label>
            <div class="col-sm-8 my-auto">
              <input #is_guarantor type="checkbox" formControlName="is_guarantor">
            </div>
          </div>
        </div>
        <div class="col-md-6"></div>
      </div>
      <div class="form-group row d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-customer']" class="btn btn-danger mr-1">Cancel</a>
      </div>
    </form>
  </div>
</div>
