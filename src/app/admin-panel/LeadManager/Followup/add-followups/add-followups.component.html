<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Followup</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-lead-management']" class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Lead</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form class="bs-example form-horizontal" [formGroup]="AddFollowups" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" disabled>
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">Branch Name <span class="error">*</span></label>
            <div class="col-sm-10">
              <select #branch_id formControlName="branch_id" disabled>
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                <label *ngIf="f.branch_id.errors.required">Branch is required</label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Employee Name</label>
            <div class="col-sm-8">
              <select #employee_id formControlName="employee_id">
                <option value="">Select Employee</option>
                <option *ngFor="let data of employeeList" value="{{data.id}}">{{data.first_name}} {{data.last_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.employee_id.errors" class="invalid-feedback">
                <label *ngIf="f.employee_id.errors.required">Employee is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4  col-form-label">Date <span class="error">*</span></label>
            <div class="col-sm-8 ">
              <input #followup_date type="text" class="form-control calendar" placeholder="Enter Date" [maxDate]="maxDate" formControlName="followup_date" (click)="d1.toggle()" (dateSelect)="follDateChg($event)" ngbDatepicker #d1="ngbDatepicker" onkeydown="return false">
              <div class="col-md-12" *ngIf="submitted && f.followup_date.errors" class="invalid-feedback">
                <label *ngIf="f.followup_date.errors.required">Date is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4  col-form-label">Next Followup Date <span class="error">*</span></label>
            <div class="col-sm-8 ">
              <input #next_followup_date type="text" class="form-control calendar" placeholder="Enter Next Followup Date" [minDate]="minDate" formControlName="next_followup_date" (click)="d2.toggle()" ngbDatepicker #d2="ngbDatepicker" onkeydown="return false">
              <div class="col-md-12" *ngIf="submitted && f.next_followup_date.errors" class="invalid-feedback">
                <label *ngIf="f.next_followup_date.errors.required">Next followup date is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Followup Status <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #followup_status_type_id formControlName="followup_status_type_id" >
                <option value="">Select Followup Status</option>
                <option *ngFor="let data of followupstatusList" value="{{data.id}}">{{data.followup_status_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="(submitted && f.followup_status_type_id.errors) " class="invalid-feedback">
                <label *ngIf="f.followup_status_type_id.errors.required">Followup status is required</label>  
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4  col-form-label">Remarks</label>
            <div class="col-sm-8 ">
              <textarea class="form-control col-md-10 col-sm-8 col-9" formControlName="remarks" rows="3"></textarea>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group row d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-lead-management']" class="btn btn-danger mr-1">Cancel</a>
      </div>
    </form>
  </div>
</div>
