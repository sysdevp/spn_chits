<div class="card maz-vh">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Log Monitoring Report</div>
      <div class="col-6 text-right">&nbsp;</div>
    </div>
  </div>
  <div class="card-body">
    <div >
      <form class="bs-example form-horizontal" [formGroup]="logMonitoringReport" (ngSubmit)="onSubmit()">
        <div class="form-group row" [hidden]="!isSuperAdmin">
          <label class="col-sm-2 col-md-2 col-3 col-form-label">Company Name <span class="error">*</span></label>
          <div class="col-sm-10">
            <select #tenant_id class="form-control form-control w-100 border-dark" formControlName="tenant_id" (change)="companyChg($event)">
              <option value="">Select Company</option>
              <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
            </select>
            <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
              <label *ngIf="f.tenant_id.errors.required">Company is required</label>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-6">
            <div class="form-group row">
              <label class="col-sm-4">Select Branch <span class="error">*</span></label>
              <div class="col-sm-8">
                <select #branch_id class="form-control form-control w-100 border-dark" formControlName="branch_id">
                  <option value="">Select Branch</option>
                  <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
                </select>
                <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                  <label *ngIf="f.branch_id.errors.required">Branch is required</label>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="form-group row">
              <label class="col-sm-4">Select Module <span class="error">*</span></label>
              <div class="col-sm-8">
                <select #module_name class="form-control form-control w-100 border-dark" formControlName="module_name">
                  <option value="">Select Module</option>
                  <option *ngFor="let data of moduleList" value="{{data.id}}">{{data.module_name}}</option>
                </select>
                <div class="col-md-12" *ngIf="submitted && f.module_name.errors" class="invalid-feedback">
                  <label *ngIf="f.module_name.errors.required">Module is required</label>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="form-group row ">
          <div class="offset-md-2 offset-sm-2 col-sm-10 col-md-7 col-12">
            <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
            <button type="button" class="btn btn-danger mr-1" (click)="resetReport()">Reset</button>
          </div>
        </div>
      </form>
      <div class="col-12 text-center no_data" [hidden]="nodataFoundMessage">
        <table class="table">
          <thead>
          <tr>
            <th>S No</th>
            <th>Branch Name</th>
            <th>Module Name</th>
            <th>Updated By</th>
            <th>Updated On</th>
            <th>Deleted By</th>
            <th>Deleted On</th>
            <th>Remarks</th>
          </tr>
        </thead>
          <tbody>
            <tr>
              <td colspan="8" style="color: #d9534f;
              border: transparent;
              font-size: 20px;">
                No Records Found
              </td>
            </tr>
          </tbody>
        </table>
      </div>
	  <div class="row recp_rep" [hidden]="hideReport">
        <div class="test-header col-5">
          Show:
          <select (change)="onPageSizeChanged()" id="page-size">
            <option value="10" selected="">10</option>
            <option value="100">100</option>
            <option value="500">500</option>
            <option value="1000">1000</option>
          </select>
          entries
        </div>
        <div class="col-4 r_rep pr-5" [hidden]="hideDataList">
          <button (click)="onBtnExport()" >Excel</button>
          <!--<button (click)="onBtnpdf()" class="mr-2">Pdf</button>-->
        </div>
        <div class="col-3 r_rep">
          <span >Search</span> 
          <input type="text" id="filter-text-box" (input)="onFilterTextBoxChanged()"/>
        </div> 
        <ag-grid-angular *ngIf="showReportGrid" #agGrid
          style="width: 100%; height: 450px; margin-top: 15px;" 
          class="ag-theme-balham"
          [rowData]="rowData" 
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [pagination]="true"
          [paginationPageSize]="paginationPageSize"
          [paginationNumberFormatter]="paginationNumberFormatter"
          [rowHeight]="50"
          [headerHeight]="50"
          [suppressExcelExport] = "true" 
          (gridReady)="onGridReady($event)"
        >     
        </ag-grid-angular>
      </div>
    
    </div>
  </div>
</div>
