<div class="card maz-vh">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Interested Customer Report</div>
      <div class="col-6 text-right">&nbsp;</div>
    </div>
  </div>
  <div class="card-body">
    <div>
      <form class="bs-example form-horizontal" [formGroup]="InterestedCustomerReport" (ngSubmit)="onSubmit()">
        <div class="form-group row" [hidden]="!isSuperAdmin">
          <label class="col-sm-2 col-md-2 col-3 col-form-label">Company Name <span class="error">*</span></label>
          <div class="col-sm-10">
            <select #tenant_id class="form-control form-control w-100 border-dark" formControlName="tenant_id" (change)="companyChg($event)">
              <option value="">Select Company</option>
              <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
            </select>
            <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
              <label *ngIf="f.tenant_id.errors.required">Company is required</label>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-6">
            <div class="form-group row">
              <label class="col-sm-4">Select Branch <span class="error">*</span></label>
              <div class="col-sm-8">
                <select #branch_id class="form-control form-control w-100 border-dark" formControlName="branch_id" (change)="branchChg($event)">
                  <option value="">Select Branch</option>
                  <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
                </select>
                <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                  <label *ngIf="f.branch_id.errors.required">Branch is required</label>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="form-group row">
              <label class="col-sm-4">Select Scheme</label>
              <div class="col-sm-8">
                <select #scheme_id class="form-control form-control w-100 border-dark" formControlName="scheme_id">
                  <option value="">Select Group</option>
                  <option *ngFor="let data of schemeList" value="{{data.id}}">{{data.scheme_name}}</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="row">
            <div class="col-6">
                <div class="form-group row">
                  <label class="col-sm-4">Start Date</label>
                  <div class="col-sm-8">
                    <input #start_date type="text" formControlName="start_date" class="form-control calendar" placeholder="Enter Date" (click)="d1.toggle()" ngbDatepicker #d1="ngbDatepicker" onkeydown="return false">
                  </div>
                </div>
              </div>
              <div class="col-6">
                  <div class="form-group row">
                    <label class="col-sm-4">End Date</label>
                    <div class="col-sm-8">
                      <input #end_date type="text" formControlName="end_date" class="form-control calendar" placeholder="Enter Date" (click)="d2.toggle()" ngbDatepicker #d2="ngbDatepicker" onkeydown="return false">
                    </div>
                  </div>
                </div>
          </div>
       
      
        <div class="form-group row ">
          <div class="offset-md-2 offset-sm-2 col-sm-10 col-md-7 col-12">
            <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
            <button type="button" class="btn btn-danger mr-1" (click)="resetReport()">Reset</button>
          </div>
        </div>
      </form>
      <table id="dtable" class="row-border hover" [hidden]="TableHidden">
        <thead>
          <tr> 
            <th>SNo</th>
            <th>Branch Name</th>
            <th>Chit Value</th>
            <th>Customer Name</th>
            <th>Phone Number</th>
            <th>Interested Date</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of dataList;">
            <td>{{row.sno}}</td>
            <td>{{row.branch_info.branch_name}}</td>
            <td>{{row.scheme_info.chit_value}}</td>
            <td>{{row.customer_info.name}}</td>
            <td>{{row.customer_info.phone_no}}</td>
            <td>{{row.interested_date}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
