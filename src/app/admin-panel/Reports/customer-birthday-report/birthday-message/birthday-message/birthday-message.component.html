<div class="card mb-4">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold"> Birthday Message Detail</div>
      <div class="col-6 d-flex justify-content-end"> 
      </div>   
    </div>
  </div>
  <div class="card-body">
    <form class="bs-example form-horizontal" [formGroup]="Messagesent" (ngSubmit)="onSubmit()" >
      <div class="form-group row">
        <label for="inputEmail3" class="col-sm-2 col-form-label">Content</label>
        <div class="col-sm-10">
          <textarea class="form-control px-2" rows="3" placeholder="Remarks"  formControlName="content"></textarea>
        </div>
      </div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1 " >{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/customer-birthday-report']" class="btn btn-danger mr-1 ">Cancel</a>
      </div> 	
    </form>
  </div>
</div>
