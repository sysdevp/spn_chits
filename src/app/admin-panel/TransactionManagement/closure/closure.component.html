<div class="card">
    <div class="card-header">
    <div class="row">
    <div class="col-6 my-auto font-weight-bold">Add Closure Details</div>
    <div class="col-6 text-right">
    <a [routerLink]="['/admin-panel/payment-refund-report']" class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i>Closure Report</a>
    </div>
    </div>
    </div>
    <div class="card-body add-maze">
    <form class="bs-example form-horizontal" [formGroup]="AddEnrolRefundAmount" (ngSubmit)="onSubmit()">
    <div class="form-group row" [hidden]="!isSuperAdmin">
    <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
    <div class="col-sm-10">
    <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
    <option value="">Select Company</option>
    <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
    </select>
    <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
    <label *ngIf="f.tenant_id.errors.required">Company is required</label>
    </div>
    </div>
    </div>
    <div class="row">
    <div class="col-6">
    <div class="form-group row">
    <label class="col-sm-4">Branch Name <span class="error">*</span></label>
    <div class="col-sm-8">
    <select #branch_id formControlName="branch_id" (change)="branchChg($event)">
    <option value="">Select Branch</option>
    <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
    </select>
    <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
    <label *ngIf="f.branch_id.errors.required">Branch is required</label>
    </div>
    </div>
    </div>
    </div>
    <div class="col-6">
    <div class="form-group row">
    <label class="col-sm-4">Select Group Name <span class="error">*</span></label>
    <div class="col-sm-8">
    <select #group_id formControlName="group_id"(change)="groupChg($event)">
    <option value="">Select Group Name </option>
    <option *ngFor="let data of groupList" value="{{data.id}}">{{data.group_name}}</option>
    </select>
    <div class="col-md-12" *ngIf="submitted && f.group_id.errors" class="invalid-feedback">
    <label *ngIf="f.group_id.errors.required">Group is required</label>
    </div>
    </div>
    </div>
    </div>
    </div>
    <div class="row">
    <div class="col-6">
    <div class="form-group row">
    <label class="col-sm-4">Select Customer <span class="error">*</span></label>
    <div class="col-sm-8">
    <select #customer_id formControlName="customer_id" (change)="customerChg($event)">
    <option value="">Select Customer</option>
    <option *ngFor="let data of customerList" value="{{data.customer_id}}">{{data.customer_info.name}}</option>
    </select>
    <div class="col-md-12" *ngIf="submitted && f.customer_id.errors" class="invalid-feedback">
    <label *ngIf="f.customer_id.errors.required">Customer is required</label>
    </div>
    </div>
    </div>
    </div>
    <div class="col-md-6">
    <div class="form-group row">
    <label class="col-sm-4">Closure Date<span class="error">*</span></label>
    <div class="col-sm-8">
    <input #payment_date type="text" formControlName="payment_date" class="form-control calendar" placeholder="Enter Refund Date" [maxDate]=currentDate (click)="d1.toggle()" ngbDatepicker #d1="ngbDatepicker" onkeydown="return false">
    <div class="col-md-12" *ngIf="submitted && f.payment_date.errors" class="invalid-feedback">
    <label *ngIf="f.payment_date.errors.required">Refund Date is required</label>
    </div>
    </div>
    </div>
    </div>
    </div>
    <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Closure Type <span class="error">*</span></label>
            <div class="col-sm-8">
              <input type="radio" name="closure_type"> Normal 
              <input type="radio" name="closure_type"> Pre Closure 
              <input type="radio" name="closure_type"> Draw Winner 
               </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Closure No</label>
            <div class="col-sm-8">
              <input #register_fees type="text" class="form-control" placeholder="Enter Closure No" formControlName="register_fees">
              <div class="col-md-12" *ngIf="submitted && f.register_fees.errors" class="invalid-feedback">
                <label *ngIf="f.register_fees.errors.pattern">Invalid format</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    <div class="row">
    <div class="col-6">
    <div class="form-group row">
    <label class="col-sm-4">Total Installment <span class="error">*</span></label>
    <div class="col-sm-8">
        
            <input type="text" class="form-control calendar" value="{{PaidAmt}}" readonly>
            
    </div>
    </div>
    </div>
    <div class="col-md-6">
    <div class="form-group row">
    <label class="col-sm-4">Paid Installment</label>
    <div class="col-sm-8">
    <input type="text" class="form-control calendar" value="{{PaidAmt}}" readonly>
    </div>
    </div>
    </div>
    </div>
    <div class="row">
    <div class="col-6">
    <div class="form-group row">
    <label class="col-sm-4">Paid Amount</label>
    <div class="col-sm-8">
    <input type="text" class="form-control calendar" value="{{CancelAmt}}" readonly>
    </div>
    </div>
    </div>
    <div class="col-md-6">
    <div class="form-group row">
    <label class="col-sm-4">Bonus Amount</label>
    <div class="col-sm-8">
    <!--<input type="text" class="form-control calendar" value="{{penaltyAmt}}" >-->
    <input #penalty_amount type="text" formControlName="penalty_amount" class="form-control calendar" placeholder="Enter Penalty Amount" (blur)="penaltyAmtChg($event)">
    <div class="col-md-12" *ngIf="(submitted && f.penalty_amount.errors)" class="invalid-feedback">
      <label *ngIf="(f.penalty_amount.errors.pattern)">Invalid format</label>
    </div>
    <div class="col-md-12" [hidden]="hidepenaltyAlert" class="invalid-feedback">
      <label>Bonus amount should be less than or equal to available refund amount</label>
      </div>
    </div>
    </div>
    </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="form-group row">
              <label class="col-sm-4 col-form-label">Advance Payment</label>
              <div class="col-sm-8">
                <input #short_term type="text" class="form-control" placeholder="Enter Advance Payment" formControlName="short_term">
              </div>
            </div>
          </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"> Draw No<span class="error">*</span></label>
            <div class="col-sm-8">
             <input #monthly_due type="text" class="form-control" placeholder="Enter Draw No" formControlName="monthly_due">
             
            </div>
          </div>
        </div>
      </div>
    <div class="row">
    <div class="col-6">
    <div class="form-group row">
    <label class="col-sm-4">Net Amount</label>
    <div class="col-sm-8">
    <input class="form-control calendar" value="{{AvailableRefund}}" readonly>
    </div>
    </div>
    </div>
    <div class="col-6">
    <div class="form-group row">
    <label class="col-sm-4">Refund Amount <span class="error">*</span></label>
    <div class="col-sm-8">
    <input #total_amount type="text" formControlName="total_amount" class="form-control calendar" placeholder="Enter Refund Amount" (blur)="refundAmtChg($event)">
    <div class="col-md-12" *ngIf="submitted && f.total_amount.errors" class="invalid-feedback">
    <label *ngIf="f.total_amount.errors.required">Total Amount is required</label>
    <label *ngIf="f.total_amount.errors.pattern">Invalid format</label>
    </div>
    <div class="col-md-12" *ngIf="submitted && refundAlertMsg" class="invalid-feedback">
    <label>{{refundAlertMsg}}</label>
    </div>
    <div class="col-md-12" [hidden]="hideRefundAlert" class="invalid-feedback">
    <label>Refund amount should be less than or equal to available refund amount</label>
    </div>
    </div>
    </div>
    </div>
    </div>
    
    <div class="form-group d-flex justify-content-center">
    <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
    <a [routerLink]="['/admin-panel/payment-refund-report']" class="btn btn-danger mr-1">Cancel</a>
    </div> 
    </form>
    </div>
   </div>
