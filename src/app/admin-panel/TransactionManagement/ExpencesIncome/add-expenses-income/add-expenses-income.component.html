<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Account Expenses</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/add-expenses-income-report']" class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i>Account Expenses Report</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form class="bs-example form-horizontal" [formGroup]="AddExpensesIncome" (ngSubmit)="onSubmit()">
    <div class="form-group row" [hidden]="!isSuperAdmin">
      <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
      <div class="col-sm-10">
        <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
          <option value="">Select Company</option>
          <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
        </select>
        <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
          <label *ngIf="f.tenant_id.errors.required">Company is required</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form-group row">
          <label class="col-sm-4">Branch Name<span class="error">*</span></label>
          <div class="col-sm-8">
            <select #branch_id class="form-control col-sm-12" formControlName="branch_id">
              <option value="">Select Branch</option>
              <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
            </select>
            <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
              <label *ngIf="f.branch_id.errors.required">Branch is required</label>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group row">
          <label class="col-sm-4">Date <span class="error">*</span> </label>
          <div class="col-sm-8">
            <input #entry_date type="text" class="form-control col-sm-12" placeholder="Date" formControlName="entry_date" [maxDate]=currentDate (click)="d1.toggle()" ngbDatepicker #d1="ngbDatepicker" onkeydown="return false">
            <div class="col-md-12" *ngIf="submitted && f.entry_date.errors" class="invalid-feedback">
              <label *ngIf="f.entry_date.errors.required">Date is required</label>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group row">
          <label class="col-sm-4">Voucher No  </label>
          <div class="col-sm-8">
            <input #voucher_no type="text" class="form-control col-sm-12" value="{{voucher_no_list}}" placeholder="Voucher No" formControlName="voucher_no" >
            <div class="col-md-12" *ngIf="submitted && f.voucher_no.errors" class="invalid-feedback">
              <label *ngIf="f.voucher_no.errors.required">Voucher No is required</label>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group row">
          <label class="col-sm-4">Remarks </label>
          <div class="col-sm-8">
            <input #remarks type="text" class="form-control col-sm-12" placeholder="Remarks" formControlName="remarks" >
            <div class="col-md-12" *ngIf="submitted && f.remarks.errors" class="invalid-feedback">
              <label *ngIf="f.remarks.errors.required">Remarks is required</label>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group row">
          <label class="col-sm-4">Expense Type<span class="error">*</span></label>
          <div class="col-sm-8">
            <select #expense_type class="form-control col-sm-12" formControlName="expense_type">
              <option value="">Select Expense Type</option>
              <option value="1">Contra Entry</option>
              <option value="2">Receipt</option>
              <option value="3">Payment</option>
            </select>
            
          </div>
        </div>
      </div>
    </div>
    <div class="row border emp_hrm"  [formGroup]="AddExpensesIncome">
      <h5 class="col-6 my-auto font-weight-bold">Debit</h5>
      <div class="col-md-12" formArrayName="debits">
        <div class="hrm_c_l" *ngFor="let debit of debits['controls']; let i=index;" formGroupName="{{i}}">
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label">Account Head</label> 
                <select #debit_account_head class="form-control col-sm-12" formControlName="debit_account_head">
                  <option value="">Select Head</option>
                  <option *ngFor="let data of groupList" value="{{data.id}}">{{data.name}}</option>
                </select>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label">Amount</label>
                <input #debit_amount type="text" class="form-control"  placeholder="Amount" name="debit_amount"  formControlName="debit_amount" (change)="amountChg(i)">
                <div class="col-md-12" *ngIf="submitted && f.debit_amount.errors" class="invalid-feedback">
                  <label *ngIf="f.debit_amount.errors.required">Amount is required</label>
                  <label *ngIf="f.debit_amount.errors.pattern">Invalid Format</label>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label">Debit Remarks</label>
                <input #debit_remarks type="text" class="form-control"  placeholder="Debit Remarks" name="debit_remarks"  formControlName="debit_remarks">
                <div class="col-md-12" *ngIf="submitted && f.debit_remarks.errors" class="invalid-feedback">
                  <label *ngIf="f.debit_remarks.errors.required">Debit Remarks is required</label>
                </div>
              </div>
            </div>
            <div class="col-md-4" [hidden]="hidearray">
              <div class="form-group">
                <label class="form-label">Account Head</label> 
                <select #credit_account_head class="form-control col-sm-12" formControlName="credit_account_head">
                  <option value="">Select Head</option>
                  <option *ngFor="let data of groupList" value="{{data.id}}">{{data.name}}</option>
                </select>
              </div>
            </div>
            <div class="col-md-4" [hidden]="hidearray">
              <div class="form-group">
                <label class="form-label">Amount</label>
                <input type="text" class="form-control"  placeholder="Amount" name="credit_amount"  formControlName="credit_amount" (change)="amountChg(i)">
                <!--<div class="col-md-12" *ngIf="submitted && f.amount.errors" class="invalid-feedback">
                  <label *ngIf="f.amount.errors.required">Amount is required</label>
                  <label *ngIf="f.amount.errors.pattern">Invalid Format</label>
                </div>-->
              </div>
            </div>
            <div class="col-md-4" [hidden]="hidearray">
              <div class="form-group">
                <label class="form-label">Debit Remarks</label>
                <input #debit_remarks type="text" class="form-control"  placeholder="Debit Remarks" name="debit_remarks"  formControlName="debit_remarks">
                <div class="col-md-12" *ngIf="submitted && f.debit_remarks.errors" class="invalid-feedback">
                  <label *ngIf="f.debit_remarks.errors.required">Debit Remarks is required</label>
                </div>
              </div>
            </div>
          
            <div class="row">&nbsp;</div>
          </div>
          <div class="row">&nbsp;</div>
        </div>
      </div>
      <div class="col-md-12 hrm_service">
        <p class="text-right my-2">
          <button type="button" (click)="adddebit()"> <span>+</span> Add More</button>
        </p>
      </div>
      <div class="col-md-12 text-right">
        <p><b>Grand Total ( ₹ ) {{TotalAmtdebit}}</b></p>
      </div>
    </div>
    <div class="row border emp_hrm"  [formGroup]="AddExpensesIncome">
      <h5 class="col-6 my-auto font-weight-bold">Credit</h5>
      <div class="col-md-12" formArrayName="credits">
        <div class="hrm_c_l" *ngFor="let pfnominee of credits['controls']; let i=index;" formGroupName="{{i}}">
          <div class="row">
            <div class="col-md-6" [hidden]="hidearray">
              <div class="form-group">
                <label class="form-label">Account Head</label> 
                <select #debit_account_head class="form-control col-sm-12" formControlName="debit_account_head">
                  <option value="">Select Group</option>
                  <option *ngFor="let data of groupLists" value="{{data.id}}">{{data.name}}</option>
                </select>
              </div>
            </div>
            <div class="col-md-6" [hidden]="hidearray">
              <div class="form-group">
                <label class="form-label">Amount</label>
                <input type="text" class="form-control"  placeholder="Amount" name="debit_amount"  formControlName="debit_amount" (change)="amountcreditChg(i)">
                <!--<div class="col-md-12" *ngIf="submitted && f.amount.errors" class="invalid-feedback">
                  <label *ngIf="f.amount.errors.required">Amount is required</label>
                  <label *ngIf="f.amount.errors.pattern">Invalid Format</label>
                </div>-->
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label">Account Head</label> 
                <select #credit_account_head class="form-control col-sm-12" formControlName="credit_account_head">
                  <option value="">Select Head</option>
                  <option *ngFor="let data of groupLists" value="{{data.id}}">{{data.name}}</option>
                </select>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label">Amount</label>
                <input type="text" class="form-control"  placeholder="Amount" name="credit_amount"  formControlName="credit_amount" (change)="amountcreditChg(i)">
                <!--<div class="col-md-12" *ngIf="submitted && f.credit_amount.errors" class="invalid-feedback">
                  <label *ngIf="f.credit_amount.errors.required">Amount is required</label>
                  <label *ngIf="f.credit_amount.errors.pattern">Invalid Format</label>
                </div>-->
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label">Credit Remarks</label>
                <input #credit_remarks type="text" class="form-control"  placeholder="Credit Remarks" name="credit_remarks"  formControlName="credit_remarks">
                <div class="col-md-12" *ngIf="submitted && f.credit_remarks.errors" class="invalid-feedback">
                  <label *ngIf="f.credit_remarks.errors.required">Credit Remarks is required</label>
                </div>
              </div>
            </div>
            <div class="row">&nbsp;</div>
          </div>
          <div class="row">&nbsp;</div>
        </div>
      </div>
      <div class="col-md-12 hrm_service">
        <p class="text-right my-2">
          <button type="button" (click)="addcredit()"> <span>+</span> Add More</button>
        </p>
      </div>
      <div class="col-md-12 text-right">
        <p><b>Grand Total ( ₹ ) {{TotalCreditAmt}}</b></p>
      </div>
    </div>
    <!--<div class="row">
      <div class="col-md-6" [hidden]="hidePayment">
        <div class="form-group row">
          <label for="exampleFormControlSelect1" class="col-sm-4">Payment Mode <span class="error">*</span></label>
          <div class="col-sm-8">
            <select #payment_mode class="form-control col-sm-12" formControlName="payment_mode" (change)="paymentchg()">
              <option value="">Select Payment Mode</option>
              <option value="1">Cash</option>
              <option value="2">Bank</option>
            </select>
            <div class="col-md-12" *ngIf="submitted && f.payment_mode.errors" class="invalid-feedback">
              <label *ngIf="f.payment_mode.errors.required">Payment Mode is required</label>
            </div>
          </div>
        </div>
      </div>
    </div>-->
    <div class="form-group d-flex justify-content-center">
      <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
      <a [routerLink]="['/admin-panel/add-expenses-income-report']" class="btn btn-danger mr-1">Cancel</a> 
    </div> 
    </form> 
  </div>
</div>
