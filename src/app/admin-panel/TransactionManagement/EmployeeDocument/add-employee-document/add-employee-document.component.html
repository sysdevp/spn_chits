<ng-template #uploadModal let-c="close" let-d="dismiss">
  <div class="modal-header without-text d-flex p-2">
    <h4 class="mb-0 my-auto text-white px-3">Upload Document</h4>
    <button type="button" class="btn btn-default mx-2 text-white border-white px-3 py-2 rounded-circle" id="myDiv" style="color:#000;" (click)="c('Close click');uploader.clearQueue()">X</button>
  </div>
  <div class="ng2-file-upload-drop-zone text-center py-2 px-3" style="border-bottom: 1px solid #8897aa;margin: 10px;"
    ng2FileDrop
    [ngClass]="{'ng2-file-upload-file-over': hasBaseDropZoneOver}"
    (fileOver)="fileOver($event)"
    [uploader]="uploader">
    <div class="row">
      <div class="col-md-12 col-12 d-flex justify-content-center">
        <label class="btn btn-secondary mr-2">Select file
          <input type="file" class="sr-only" ng2FileSelect [uploader]="uploader" accept="image/*">
        </label>
        <div class="mr-3 text-center service_up">
          <button type="button" class="progress-resume-link btn btn-primary" (click)="uploadAssetDetails(uploader.queue);c('Close click');uploader.clearQueue()"
          [disabled]="!uploader.getNotUploadedItems().length" ngbTooltip="Upload all">
          <i class="icon ion-md-cloud-upload px-2"></i> Upload File</button>
        </div>
      </div>
    </div>
  </div>
  <div class="media mt-4" [class.d-none]="!uploader?.queue?.length">
    <div class="row" style="width: 100%;"> 
      <div class="col-md-12">
        <div class="media-body align-self-center" style="margin-top: 13px;"> 
          <div class="progress-container progress">
            <div class="progress-bar" [ngStyle]="{ 'width': uploader.progress + '%' }"></div>
          </div>
        </div>
      </div>
      <div class="col-md-12">
        <ul class="list-group mt-4" [class.d-none]="!uploader?.queue?.length" >
          <!-- Files -->
          <li class="list-group-item" *ngFor="let item of uploader.queue; let i = index;"> 
            <div class="media">
              <div class="media-body">
                <div class="file_n_scrl">
                  <span *ngIf="item.isSuccess"><i class="ion ion-md-checkmark text-success text-big mr-2"></i></span> 
                  <span *ngIf="item.isError"><i class="ion ion-md-alert text-danger text-big mr-2"></i></span>
                  <strong>File {{ item?.file?.name }}</strong>
                  <span>- <em class="text-muted">{{ item.progress + '%' }}</em></span>
                  <small class="text-muted" nowrap>
                  {{ item?.file?.size/1024/1024 | number:'.2' }} MB
                  </small>
                </div>
              </div>
              <div class="align-self-center ml-3">
                <button type="button" class="btn btn-sm icon-btn btn-outline-danger" (click)="item.remove()"><i class="ion ion-md-trash"></i></button>
              </div>
            </div> 
          </li>
        </ul>
      </div>
    </div>
  </div> 
</ng-template>

<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Employee Documents</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-employee-document']"  class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Employee Document Details</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze ">
    <form class="bs-example form-horizontal" [formGroup]="AddLoanCustomerDocument" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Branch <span class="error">*</span></label>
            <div class="col-sm-8">
              <select formControlName="branch_id" (change)="branchChg($event)">
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                <label *ngIf="f.branch_id.errors.required">Branch is required</label>
              </div>
            </div>
          </div> 
        </div>
                                                                      
        <!--<div class="col-md-12" [hidden]="hideChitDetail">
          <div class="form-group row" [hidden]="hideChitDetail">
            <label class="col-sm-2">Upload Details</label>
            <div class="col-sm-6" >
              <table style="width:100%" class="table" >
                <tr>
                  <th>SNo</th>
                  <th>Group Name</th>
                  <th>Chit Value</th>
                  <th> Upload</th>
                </tr>
                <tr>
                <tr *ngFor="let enroll of enrollmentList; let i=index;">
                  <td>{{i+1}}</td>
                  <td>{{enroll.enrol_name}}</td>
                  <td>{{enroll.chit_value}}</td>
                  <td>
                    <div class="radio">
                      <label><input type="radio"  value="1" formControlName="enrollment_id" (change)="uploadChg()"></label>
                    </div>
                  </td>
                </tr>
              </table>
            </div>
          </div>
        </div>-->
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4">Employee <span class="error">*</span></label>
            <div class="col-sm-8">
              <select formControlName="collected_employee_id" >
                <option value="">Select Employee</option>
                <option *ngFor="let data of employeeList" value="{{data.id}}">{{data.first_name}} {{data.last_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.collected_employee_id.errors" class="invalid-feedback">
                <label *ngIf="f.collected_employee_id.errors.required">Employee is required</label>
              </div>
            </div>
          </div>
        </div>
        <!-- <div class="col-md-6" [hidden]="isChitSelected">
          <div class="form-group row">
            <label class="col-sm-4">Collected From <span class="error">*</span></label>
            <div class="col-sm-8">
              <select formControlName="collected_from"  (change)="collectedFromChg($event)">
                <option value="">Select Collected From</option>
                <option value="1">Customer</option>
                <option value="2">Guarantor</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.collected_from.errors" class="invalid-feedback">
                <label *ngIf="f.collected_from.errors.required">Collected From is required</label>
              </div>
            </div>
          </div>
        </div> -->
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4">Document Collected Date <span class="error">*</span></label>
            <div class="col-sm-8"> 
              <input type="text" class="form-control px-2" placeholder="Document Collected Date" formControlName="collect_date" (click)="d1.toggle()" ngbDatepicker #d1="ngbDatepicker" onkeydown="return false">
              <div class="col-md-12" *ngIf="submitted && f.collect_date.errors" class="invalid-feedback">
                <label *ngIf="f.collect_date.errors.required">Document Collected Date is required</label>
              </div>
            </div>  
          </div>
        </div>
        
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4">No. of Documents collected</label>
            <div class="col-sm-8">
              <input #documentcount type="text" class="form-control px-2" placeholder="No. of Documents collected" (blur)="noOfDocChg($event)" name="documentcount">
            </div>  
          </div>
        </div>
        
        <div class="col-md-6" [hidden]="isChitSelected">
          <div class="form-group row">
            <label class="col-sm-4">Remark</label>
            <div class="col-sm-8">
              <textarea #remark class="form-control px-2" rows="3" placeholder="Remark" formControlName="remark"></textarea>
            </div>
          </div>
        </div>
      </div> 
      <div class="row border emp_hrm mz-add-cus" [hidden]="hideDocuments">
        <h5 class="col-md-12 py-3">Documents Details</h5>
        <div class="col-md-12" formArrayName="DocumentDetails">
          <table class="table col-sm-12">
            <thead class="thead-light">
              <tr>
                <th>Sno</th>
                <th>Document Name</th>
                <th>Document Ref No</th>
                <th>Upload Document</th>
              </tr>
            </thead>
            <tr *ngFor="let document of DocumentDetails['controls']; let i = index;" formGroupName="{{i}}">
              <td>{{i+1}}</td>
              <td>
                <input type="text" class="form-control" placeholder="Enter Document Name" formControlName="document_type" >
                <div class="col-md-12" *ngIf="submitted && document.controls.document_type.errors" class="invalid-feedback">
                  <label *ngIf="document.hasError('required', 'document_type')">Document Type is required</label>
                </div>
              </td>
              <td>
                <input type="text" class="form-control" placeholder="Enter Document Ref No" formControlName="document_no"/>
                <div class="col-md-12" *ngIf="submitted && document.controls.document_no.errors" class="invalid-feedback">
                  <label *ngIf="document.hasError('required', 'document_no')">Document Ref No is required</label>
                </div>
              </td>
              <td class="custom-file">
                <a (click)="open(uploadModal, { windowClass: 'modal-lg animate' },i,'document')" for="inputGroupFile01" class="white_btn logobtn p-2  text-dark rounded w-100 btn">
                  <b *ngIf="(document.get('document_path').value)==''">Choose File</b>
                  <b class="uploaded-files" *ngIf="(document.get('document_path').value)!=''">Uploaded</b><br/> 
                  <div class="col-md-12" *ngIf="submitted && document.controls.document_path.errors" class="invalid-feedback">
                    <label *ngIf="document.hasError('required', 'document_path')">Document Upload is required</label>
                  </div>
                </a>
              </td>
            </tr>
          </table>
        </div>
      </div>
      
      <div class="row">&nbsp;</div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-loan-customer-document']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
