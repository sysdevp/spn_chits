<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Role &amp; Permission – Add</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/update-permission']" class="bg-info border-0 text-white px-3 py-2"><i class="fas fa-edit pr-2"></i> Edit Permissions</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <div class="form-group row" *ngIf="isSuperAdmin">
      <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
      <div class="col-sm-10">
        <select class="form-control" [(ngModel)]="tenantId" (change)="companyChg()">
          <option value="">Select Company</option>
          <option *ngFor="let data of companyList" [value]="data.id">{{ data.chit_fund_name }}</option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="submitted && !tenantId">Company is required</div>
      </div>
    </div>
    <div class="form-group row">
      <label class="col-sm-2 col-form-label">Role <span class="error">*</span></label>
      <div class="col-sm-4">
        <select class="form-control" [(ngModel)]="roleId">
          <option value="">Select Role (without permission yet)</option>
          <option *ngFor="let data of roleList" [value]="data.id">{{ data.role_name }}</option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="submitted && !roleId">Role is required</div>
        <small class="text-muted" *ngIf="tenantId && !roleList.length">All roles already have permissions — use <b>Edit Permissions</b>.</small>
      </div>
      <label class="col-sm-2 col-form-label">Copy access from</label>
      <div class="col-sm-4 d-flex">
        <select class="form-control mr-2" [(ngModel)]="copyRoleId">
          <option value="">Start empty</option>
          <option *ngFor="let data of copyRoleList" [value]="data.id">{{ data.role_name }}</option>
        </select>
        <button type="button" class="btn btn-outline-primary" [disabled]="!copyRoleId" (click)="copyFromRole()">Copy</button>
      </div>
    </div>

    <app-permission-matrix [state]="state"></app-permission-matrix>

    <div class="form-group row d-flex justify-content-center mt-3">
      <button type="button" class="btn btn-primary" [disabled]="disableBtn" (click)="onSubmit()">{{ SubmitbuttonName }}</button>
    </div>
  </div>
</div>
