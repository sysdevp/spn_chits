<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Loan</div>
      <div class="col-6 text-right">
        <a
          [routerLink]="['/admin-panel/view-loan']"
          class="bg-info border-0 text-white px-3 py-2"
        >
          <i class="fas fa-eye pr-2"></i> View Loan</a
        >
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form
      class="bs-example form-horizontal"
      [formGroup]="AddLoan"
      (ngSubmit)="onSubmit()"
    >
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label"
          >Company Name <span class="error">*</span></label
        >
        <div class="col-sm-10">
          <select
            #tenant_id
            formControlName="tenant_id"
            (change)="companyChg($event)"
          >
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{ data.id }}">
              {{ data.chit_fund_name }}
            </option>
          </select>
          <div
            class="col-md-12"
            *ngIf="submitted && f.tenant_id.errors"
            class="invalid-feedback"
          >
            <label *ngIf="f.tenant_id.errors.required"
              >Company is required</label
            >
          </div>
        </div>
      </div>
      <!-- <div class="row"></div> -->
      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Branch <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select
                #branch_id
                formControlName="branch_id"
                (change)="branchChg($event)"
              >
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{ data.id }}">
                  {{ data.branch_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.branch_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.branch_id.errors.required"
                  >Branch is required</label
                >
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Customer <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <ng-multiselect-dropdown
                [placeholder]="'Select Customer'"
                [data]="dropdownList"
                formControlName="customer_id"
                [settings]="dropdownSettings"
                (onSelect)="customerChg($event)"
              >
              </ng-multiselect-dropdown>
              <div
                class="col-md-12"
                *ngIf="submitted && f.customer_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.customer_id.errors.required"
                  >Customer Name is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Disbursement Date <span class="error">*</span>
            </label>
            <div class="col-sm-8">
              <input
                #loan_date
                type="text"
                formControlName="loan_date"
                class="form-control calendar"
                placeholder="Enter Disbursement Date"
                [maxDate]="currentDate"
                (click)="d1.toggle()"
                ngbDatepicker
                #d1="ngbDatepicker"
                onkeydown="return false;"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.loan_date.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.loan_date.errors.required"
                  >Disbursement Date is required</label
                >
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Loan Type <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select
                #loan_type
                formControlName="loan_type"
                (change)="loanTypeChg($event)"
              >
                <option value="">Select Loan Type</option>
                <!--<option value="1">Balance Collection </option>-->
                <option value="2">Loan Collection</option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.loan_type.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.loan_type.errors.required"
                  >Loan Type is required</label
                >
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-12" [hidden]="hideEnrollDetail">
          <div class="form-group row" [hidden]="hideEnrollDetail">
            <label class="col-sm-2"></label>
            <div class="col-sm-10">
              <table style="width: 100%" class="table">
                <tr>
                  <th>SNo</th>
                  <th>Group Name</th>
                  <th>Chit Value</th>
                  <th>Payment Release</th>
                  <th>Paid Receipt Amount</th>
                </tr>
                <tr *ngFor="let enroll of EnrollList; let i = index">
                  <td>{{ enroll.sno }}</td>
                  <td>{{ enroll.group_name }}</td>
                  <td>{{ enroll.chit_value }}</td>
                  <td>{{ enroll.payment_release }}</td>
                  <td>{{ enroll.total_receipt_amount }}</td>
                </tr>
              </table>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Loan Amount <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #loan_amount
                type="text"
                class="form-control"
                placeholder="Enter Loan Amount"
                formControlName="loan_amount"
                (change)="amountChg($event)"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.loan_amount.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.loan_amount.errors.required"
                  >Loan Amount is required</label
                >
                <label *ngIf="f.loan_amount.errors.pattern"
                  >Invalid pattern</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >No of Installment <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #emi_months
                type="text"
                class="form-control"
                placeholder="Enter No of Installment"
                formControlName="emi_months"
                (change)="emiChg($event)"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.emi_months.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.emi_months.errors.required"
                  >No of Installment is required</label
                >
                <label *ngIf="f.emi_months.errors.pattern"
                  >Invalid pattern</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Reference Name </label>
            <div class="col-sm-8">
              <input
                #reference_grp
                type="text"
                class="form-control"
                placeholder="Enter Reference Name"
                formControlName="reference_grp"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.reference_grp.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.reference_grp.errors.required"
                  >Reference Name is required</label
                >
                <label *ngIf="f.reference_grp.errors.pattern"
                  >Invalid format</label
                >
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6" [hidden]="hideInterestType">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4"
              >Select Interest Type <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select
                #interest_type
                class="form-control col-sm-12"
                formControlName="interest_type"
                (change)="interestTypeChg($event)"
              >
                <option value="">Select Interest Type</option>
                <option value="1">Daily Interest</option>
                <option value="2">Weekly Interest</option>
                <option value="3">Monthly Interest</option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.interest_type.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.interest_type.errors.required"
                  >Interest Type is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideInterestAmount">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Interest Percentage % <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #interest_percentage
                type="text"
                class="form-control"
                placeholder="Enter Interest Amount"
                formControlName="interest_percentage"
                (change)="interestAmtChg($event)"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.interest_percentage.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.interest_percentage.errors.required"
                  >Interest Amount is required</label
                >
                <label *ngIf="f.interest_percentage.errors.pattern"
                  >Invalid format
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideintAmount">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Interest Amount<span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #interest_amount
                type="text"
                class="form-control"
                value="{{ total }}"
                placeholder="Enter Interest Amount"
                formControlName="interest_amount"
              />
            </div>
          </div>
        </div>
        <!--<div class="col-md-6" [hidden]="hidetotamount">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4">Total Amount </label>
            <div class="col-sm-8">
              <input type="text" class="form-control col-sm-12" placeholder="Total Amount" value="{{totalAmt}}" readonly>
            </div>
          </div>
        </div>-->
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Collection Agent <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select
                #collect_employee_id
                formControlName="collect_employee_id"
              >
                <option value="">Select Collection Agent</option>
                <option *ngFor="let data of employeeList" value="{{ data.id }}">
                  {{ data.first_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.collect_employee_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.collect_employee_id.errors.required"
                  >Collection Agent is required</label
                >
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6" [hidden]="hidePayment">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4"
              >Payment Type <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select
                #payment_type_id
                class="form-control col-sm-12"
                formControlName="payment_type_id"
                (change)="paymentChg($event)"
              >
                <option value="">Select Payment Type</option>
                <option value="1">Cash</option>
                <option value="2">Cheque</option>
                <option value="3">D.D</option>
                <option value="4">RTGS/NEFT</option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.payment_type_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.payment_type_id.errors.required"
                  >Payment Type is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideDebitTo">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4"
              >Debit To <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #debit_to
                type="text"
                class="form-control col-sm-12"
                placeholder="Debit To"
                formControlName="debit_to"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.debit_to.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.debit_to.errors.required"
                  >Debit to is required</label
                >
                <label *ngIf="f.debit_to.errors.pattern">Invaild Pattern</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideCheque">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4"
              >Cheque No <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #cheque_no
                type="text"
                class="form-control col-sm-12"
                placeholder="Cheque No"
                formControlName="cheque_no"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.cheque_no.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.cheque_no.errors.required"
                  >Cheque no is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideCheque">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4"
              >Cheque Date <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #cheque_date
                type="text"
                class="form-control col-sm-12"
                placeholder="Cheque Date"
                (click)="d2.toggle()"
                ngbDatepicker
                #d2="ngbDatepicker"
                onkeydown="return false;"
                formControlName="cheque_date"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.cheque_date.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.cheque_date.errors.required"
                  >Cheque date is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideBank">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4"
              >Bank <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select
                #bank_name_id
                class="col-sm-12"
                formControlName="bank_name_id"
                (change)="bankChg($event)"
              >
                <option value="">Select Bank</option>
                <option *ngFor="let data of bankList" value="{{ data.id }}">
                  {{ data.bank_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.bank_name_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.bank_name_id.errors.required"
                  >Bank is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideBank">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4"
              >Branch Name</label
            >
            <div class="col-sm-8">
              <input
                #bank_branch_name
                type="text"
                class="form-control col-sm-12"
                placeholder="Bank Branch Name"
                formControlName="bank_branch_name"
                disabled
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.bank_branch_name.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.bank_branch_name.errors.required"
                  >Bank branch is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideTransaction">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4"
              >Transaction Date <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #transaction_date
                type="text"
                class="form-control col-sm-12"
                placeholder="Transaction Date"
                (click)="d3.toggle()"
                ngbDatepicker
                #d3="ngbDatepicker"
                onkeydown="return false;"
                formControlName="transaction_date"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.transaction_date.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.transaction_date.errors.required"
                  >Transaction date is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideTransaction">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4"
              >Transaction No <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #transaction_no
                type="text"
                class="form-control col-sm-12"
                placeholder="Transaction No"
                formControlName="transaction_no"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.transaction_no.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.transaction_no.errors.required"
                  >Transaction no is required</label
                >
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group row d-flex justify-content-center">
        <button
          type="submit"
          class="btn btn-primary mr-1"
          [disabled]="disableBtn"
        >
          {{ SubmitbuttonName }}
        </button>
        <a [routerLink]="['/admin-panel/view-loan']" class="btn btn-danger mr-1"
          >Cancel</a
        >
      </div>
    </form>
  </div>
</div>
