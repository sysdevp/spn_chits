<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Update Collection Feedback</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-feed-back']"  class="bg-primary border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Collection Feedback</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze ">
    <form class="bs-example form-horizontal" [formGroup]="UpdateFeedBack" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-md-2 col-3 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10 col-md-10 col-9">
          <select #tenant_id class="form-control form-control w-100 border-dark" formControlName="tenant_id" disabled>
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-md-2 col-3 col-form-label">Branch Name <span class="error">*</span></label>
        <div class="col-sm-10 col-md-10 col-9">
          <select #branch_id class="form-control form-control w-100 border-dark"  formControlName="branch_id" disabled>
            <option value=""> Select Branch </option>
            <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
            <label *ngIf="f.branch_id.errors.required">Branch Name is required</label>
          </div>
        </div>
      </div>
      <!--<div class="form-group row">
        <label class="col-sm-2 col-md-2 col-3 col-form-label">Customer <span class="error">*</span></label>
        <div class="col-sm-8">
          <select #customer_id class="form-control form-control w-100 border-dark" formControlName="customer_id" >

            <label *ngIf="f.customer_id.errors.required">Customer is required</label>
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-md-2 col-3 col-form-label">Employee <span class="error">*</span></label>
        <div class="col-sm-8">
          <select #employee_id class="form-control form-control w-100 border-dark" formControlName="employee_id" >

          </select>
          <div class="col-md-12" *ngIf="submitted && f.employee_id.errors" class="invalid-feedback">
            <label *ngIf="f.employee_id.errors.required">Employee is required</label>
          </div>
        </div>

      <div class="row">
        <div class="col-md-6" >
          <div class="form-group row">
            <label class="col-sm-4">Customer <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #customer_id class="form-control col-sm-12" formControlName="customer_id" disabled>
                <option value="">Select Customer</option>
                <option *ngFor="let data of customerList" value="{{data.id}}">{{data.name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.customer_id.errors" class="invalid-feedback">
                <label *ngIf="f.customer_id.errors.required">Customer is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" >
          <div class="form-group row">
            <label class="col-sm-4">Employee <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #employee_id class="form-control col-sm-12" formControlName="employee_id">
                <option value="">Select Employee</option>
                <option *ngFor="let data of employeeList" value="{{data.id}}">{{data.first_name}}{{data.last_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.employee_id.errors" class="invalid-feedback">
                <label *ngIf="f.employee_id.errors.required">Collect employee is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4">Followup Date<span class="error">*</span> </label>
            <div class="col-sm-8">
              <input #remark_date type="text" class="form-control" placeholder="Enter Followup Date" formControlName="remark_date" ngbDatepicker #d2="ngbDatepicker" onkeydown="return false" readonly>
              <div class="col-md-12" *ngIf="submitted && f.remark_date.errors" class="invalid-feedback">
                <label *ngIf="f.remark_date.errors.required">Followup Date is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4">Next Followup Date<span class="error">*</span> </label>
            <div class="col-sm-8">
              <input #next_followup_date type="text" class="form-control" placeholder="Enter Next Followup Date" formControlName="next_followup_date" [minDate]=currentDate (click)="d3.toggle()" ngbDatepicker #d3="ngbDatepicker" onkeydown="return false">
              <div class="col-md-12" *ngIf="submitted && f.next_followup_date.errors" class="invalid-feedback">
                <label *ngIf="f.next_followup_date.errors.required">Next Followup Date is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4">Feed Back<span class="error">*</span></label>
            <div class="col-sm-8">
              <select #remark_id formControlName="remark_id">
                <option value="">Select Feed Back</option>
                <option *ngFor="let data of remarkList" value="{{data.id}}">{{data.remark_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.remark_id.errors" class="invalid-feedback">
                <label *ngIf="f.remark_id.errors.required">Feed Back is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4">Status<span class="error">*</span></label>
            <div class="col-sm-8">
              <select #followup_status formControlName="followup_status">
                <option value="2">Pending</option>
                <option value="1">Completed</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.followup_status.errors" class="invalid-feedback">
                <label *ngIf="f.followup_status.errors.required">Status is required</label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group row ">
        <div class="offset-md-2 offset-sm-2 col-sm-10 col-md-7 col-12">
          <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
          <a [routerLink]="['/admin-panel/view-feed-back']" class="btn btn-danger mr-1">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
