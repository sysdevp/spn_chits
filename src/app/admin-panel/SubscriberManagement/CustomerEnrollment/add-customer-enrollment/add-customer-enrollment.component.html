<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Customer Enrollment</div>
      <div class="col-6 text-right">
        <a
          [routerLink]="['/admin-panel/view-customer-enrollment']"
          class="bg-info border-0 text-white px-3 py-2"
        >
          <i class="fas fa-eye pr-2"></i> View Customer Enrollment</a
        >
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form
      class="bs-example form-horizontal"
      [formGroup]="AddCustomerEnrollment"
      (ngSubmit)="onSubmit()"
    >
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label"
          >Company Name <span class="error">*</span></label
        >
        <div class="col-sm-10">
          <select
            #tenant_id
            formControlName="tenant_id"
            (change)="companyChg($event)"
          >
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{ data.id }}">
              {{ data.chit_fund_name }}
            </option>
          </select>
          <div
            class="col-md-12"
            *ngIf="submitted && f.tenant_id.errors"
            class="invalid-feedback"
          >
            <label *ngIf="f.tenant_id.errors.required"
              >Company is required</label
            >
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Branch Name <span class="error">*</span></label
            >
            <div class="col-sm-8 d-flex">
              <select
                #branch_id
                formControlName="branch_id"
                (change)="branchChg($event)"
              >
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{ data.id }}">
                  {{ data.branch_name }}
                </option>
              </select>

              <div class="ps-2">
                <a
                  [routerLink]="['/admin-panel/add-branch']"
                  target="_blank"
                  class="btn btn-primary"
                >
                  <span>+</span>
                </a>
              </div>
            </div>

            <div
              class="col-md-12"
              *ngIf="submitted && f.branch_id.errors"
              class="invalid-feedback"
            >
              <label *ngIf="f.branch_id.errors.required"
                >Branch is required</label
              >
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Group Name <span class="error">*</span></label
            >
            <div class="col-sm-8 d-flex">
              <select
                #group_id
                formControlName="group_id"
                (change)="groupChg($event)"
              >
                <option value="">Select Group Name</option>
                <option *ngFor="let data of groupList" value="{{ data.id }}">
                  {{ data.group_name }}
                </option>
              </select>

              <div class="ps-2">
                <a
                  [routerLink]="['/admin-panel/add-group']"
                  target="_blank"
                  class="btn btn-primary"
                >
                  <span>+</span>
                </a>
              </div>
            </div>

            <div
              class="col-md-12"
              *ngIf="submitted && f.group_id.errors"
              class="invalid-feedback"
            >
              <label *ngIf="f.group_id.errors.required"
                >Group Name is required</label
              >
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Customer Name<span class="error">*</span></label
            >
            <div class="col-sm-8">
              <ng-multiselect-dropdown
                [placeholder]="'Select Customer Name'"
                [data]="dropdownList"
                formControlName="customer_id"
                [settings]="dropdownSettings"
                (onSelect)="customerChg($event)"
              >
              </ng-multiselect-dropdown>
              <div
                class="col-md-12"
                *ngIf="submitted && f.customer_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.customer_id.errors.required"
                  >Customer Name is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Ticket No <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select #ticket_no formControlName="ticket_no">
                <option value="">Select Ticket</option>
                <option
                  value="{{ item }}"
                  *ngFor="let item of ticketList; let i = index"
                >
                  {{ item }}
                </option>
              </select>

              <div
                class="col-md-12"
                *ngIf="submitted && f.ticket_no.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.ticket_no.errors.required"
                  >Ticket no is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Half Ticket No</label>
            <div class="col-sm-8">
              <select #payment_type formControlName="payment_type">
                <option value="">Select Half Ticket No</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
              </select>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Pending Tickets</label>
            <div class="col-sm-8">
              <input
                type="text"
                class="form-control"
                value="{{ pendingTickets }}"
                readonly
              />
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Payment Type <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select #payment_type formControlName="payment_type">
                <option value="">Select Payment Type</option>
                <option value="1">Daily</option>
                <option value="2">Weekly</option>
                <option value="3">Monthly</option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.payment_type.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.payment_type.errors.required"
                  >Payment type is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Collection Area <span class="error">*</span></label
            >
            <div class="col-sm-8 d-flex">
              <select
                #collection_area_id
                formControlName="collection_area_id"
                (change)="collectionareaChg($event)"
              >
                <option value="">Select Collection Area</option>
                <option
                  *ngFor="let data of collectionAreaList"
                  value="{{ data.id }}"
                >
                  {{ data.collection_area }}
                </option>
              </select>

              <div class="ps-2">
                <a
                  [routerLink]="['/admin-panel/add-collection-area-mapping']"
                  target="_blank"
                  class="btn btn-primary"
                >
                  <span>+</span>
                </a>
              </div>
            </div>

            <div
              class="col-md-12"
              *ngIf="submitted && f.collection_area_id.errors"
              class="invalid-feedback"
            >
              <label *ngIf="f.collection_area_id.errors.required"
                >Collection area is required</label
              >
            </div>
          </div>
        </div>
        <!--<div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Collection Agent</label>
            <div class="col-sm-8">
              <select #collection_agent_id formControlName="collection_agent_id">
                <option value="">Select Collection Agent</option>
                <option *ngFor="let data of collectionAgentList" value="{{data.id}}">{{data.employee_info.first_name}} {{data.employee_info.last_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.collection_agent_id.errors" class="invalid-feedback">
                <label *ngIf="f.collection_agent_id.errors.required">Collection agent is required</label>
              </div>
            </div>
          </div>
        </div>-->
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Collection Pincode</label>
            <div class="col-sm-8">
              <input
                #collection_pin
                type="text"
                class="form-control"
                placeholder="Enter Collection Pincode"
                formControlName="collection_pin"
                value="{{ CollectionAreaPincode }}"
                readonly
              />
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Refered Type <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select
                #agent_type
                formControlName="agent_type"
                (change)="agentTypeChg($event)"
              >
                <option value="">Select Refered Type</option>
                <option value="1">Customer</option>
                <option value="2">Employee</option>
                <option value="3">Business Agent</option>
                <option value="4">Self Joining</option>
                <option value="5">Others</option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.agent_type.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.agent_type.errors.required"
                  >Refered type is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="!introNameShow">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Refered Detail <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #introducer_name
                type="text"
                class="form-control"
                placeholder="Enter Introducer Name"
                formControlName="introducer_name"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.introducer_name.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.introducer_name.errors.required"
                  >Refered detail is required</label
                >
                <label *ngIf="f.introducer_name.errors.pattern"
                  >Invalid format</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="!introListShow">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label" *ngIf="introType == 1"
              >Customer <span class="error">*</span></label
            >
            <label class="col-sm-4 col-form-label" *ngIf="introType == 2"
              >Employee <span class="error">*</span></label
            >
            <label class="col-sm-4 col-form-label" *ngIf="introType == 3"
              >Business Agent <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select #introducer_id formControlName="introducer_id">
                <option value="" *ngIf="introType == 1">Select Customer</option>
                <option value="" *ngIf="introType == 2">Select Employee</option>
                <option value="" *ngIf="introType == 3">
                  Select Business Agent
                </option>
                <option
                  *ngFor="let data of introducerList"
                  value="{{ data.id }}"
                >
                  {{ data.full_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.introducer_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.introducer_id.errors.required && introType == 1"
                  >Customer is required</label
                >
                <label *ngIf="f.introducer_id.errors.required && introType == 2"
                  >Employee is required</label
                >
                <label *ngIf="f.introducer_id.errors.required && introType == 3"
                  >Business agent is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label"
              >Date of Joining <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <input
                #date_introduced
                type="text"
                formControlName="date_introduced"
                class="form-control calendar"
                placeholder="Enter Date of Joining"
                (click)="d1.toggle()"
                ngbDatepicker
                #d1="ngbDatepicker"
                onkeydown="return false;"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.date_introduced.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.date_introduced.errors.required"
                  >Date of joining is required</label
                >
              </div>
            </div>
          </div>
        </div>

            <label class="col-sm-4 col-form-label">Bonus %</label>
            <div class="col-sm-8">
              <input

                <label *ngIf="f.penalty_percentage.errors.pattern"
                  >Invalid format</label

              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Interest %</label>
            <div class="col-sm-8">
              <input
                #interest_percentage
                type="text"
                class="form-control"
                placeholder="Enter Interest Percentage"
                formControlName="interest_percentage"
              />
              <div
                class="col-md-12"
                *ngIf="submitted && f.interest_percentage.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.interest_percentage.errors.pattern"
                  >Invalid format</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Chit Asking Month</label>
            <div class="col-sm-8">
              <input
                #chit_asking_month
                type="text"
                class="form-control"
                placeholder="Chit Asking Month"
                formControlName="chit_asking_month"
              />
            </div>
          </div>
        </div>

          <div class="form-group row">

              >Enrollment Type <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select #enrolment_type formControlName="enrolment_type">
                <option value="">Select Enrollment Type</option>
                <option value="1">Active</option>
                <option value="2">In Active</option>
                <option value="3">On Hold</option>
                <option value="4">Adjustments</option>
                <option value="5">Cancel</option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.enrolment_type.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.enrolment_type.errors.required"
                  >Enrollment type is required</label
                >
              </div>
            </div>
          </div>
        </div>

                <label *ngIf="f.chit_type.errors.required"
                  >Chit type is required</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-12">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">Remarks</label>
            <div class="col-sm-10">
              <textarea
                #remarks
                class="form-control"
                placeholder="Enter Remarks"
                formControlName="remarks"
              ></textarea>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group row d-flex justify-content-center">
        <button
          type="submit"
          class="btn btn-primary mr-1"
          [disabled]="disableBtn"
        >
          {{ SubmitbuttonName }}
        </button>
        <a
          [routerLink]="['/admin-panel/view-customer-enrollment']"
          class="btn btn-danger mr-1"
          >Cancel</a
        >
      </div>
    </form>
  </div>
</div>
