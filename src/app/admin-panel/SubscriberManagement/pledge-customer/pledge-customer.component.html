

<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Pledge Customer</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/pledge-customer-report']"  class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> Pledge Details</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze ">
    <form class="bs-example form-horizontal" [formGroup]="AddPledge" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Branch Name <span class="error">*</span></label>
            <div class="col-sm-8">
              <select formControlName="branch_id" (change)="branchChg($event)">
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                <label *ngIf="f.branch_id.errors.required">Branch is required</label>
              </div>
            </div>
          </div> 
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4">Customer Name <span class="error">*</span></label>
            <div class="col-sm-8">
              <ng-multiselect-dropdown
                  [placeholder]="'Select Customer Name'"
                  [data]="dropdownList"
                  formControlName="customer_id"
                  [settings]="dropdownSettings"
                  (onSelect)="customerChg($event)">
                </ng-multiselect-dropdown>
                <div class="col-md-12" *ngIf="submitted && f.customer_id.errors" class="invalid-feedback">
                  <label *ngIf="f.customer_id.errors.required">Customer Name is required</label>
                </div>
            </div>
          </div>
        </div>
        <div class="col-md-12" [hidden]="hideChitDetail">
          <div class="form-group row" [hidden]="hideChitDetail">
            <label class="col-sm-2">Chit Details</label>
            <div class="col-sm-10" >
              <table style="width:100%" class="table" >
                <tr>
                  <th>SNo</th>
                  <th>Group Name</th>
                  <th>Chit Value</th>
                  <th> Select</th>
                </tr>
                <tr>
                <tr *ngFor="let enroll of enrollmentList; let i=index;">
                  <td>{{i+1}}</td>
                  <td>{{enroll.enrol_name}}</td>
                  <td>{{enroll.chit_value}}</td>
                  <td>
                    <div class="radio">
                      <label><input type="radio"  value="{{enroll.id}}" formControlName="enrollment_id" (change)="uploadChg()"></label>
                    </div>
                  </td>
                </tr>
              </table>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideChitDetail">
          <div class="form-group row">
            <label class="col-sm-4">Pledge Customer <span class="error">*</span></label>
            <div class="col-sm-8">
              <ng-multiselect-dropdown
                  [placeholder]="'Select Pledge Customer'"
                  [data]="dropdownList"
                  formControlName="pledge_customer_id"
                  [settings]="dropdownSettings"
                  (onSelect)="pledgecustomerChg($event)">
                </ng-multiselect-dropdown>
                <div class="col-md-12" *ngIf="submitted && f.pledge_customer_id.errors" class="invalid-feedback">
                  <label *ngIf="f.pledge_customer_id.errors.required">Pledge Customer is required</label>
                </div>
            </div>
          </div>
        </div>
        <div class="col-md-12" [hidden]="hideChitDetailpledge">
          <div class="form-group row" [hidden]="hideChitDetailpledge">
            <label class="col-sm-2">Chit Details</label>
            <div class="col-sm-10" >
              <table style="width:100%" class="table" >
                <tr>
                  <th>SNo</th>
                  <th>Group Name</th>
                  <th>Chit Value</th>
                  <th> Select</th>
                </tr>
                <tr>
                <tr *ngFor="let enroll of enrollmentpledgeList; let i=index;">
                  <td>{{i+1}}</td>
                  <td>{{enroll.enrol_name}}</td>
                  <td>{{enroll.chit_value}}</td>
                  <td>
                    <div class="radio">
                      <label><input type="radio"  value="{{enroll.id}}" formControlName="pledgeenrollment_id" (change)="uploadpledgeChg()"></label>
                    </div>
                  </td>
                </tr>
              </table>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="isChitSelected">
          <div class="form-group row">
            <label class="col-sm-4">Collected Date <span class="error">*</span></label>
            <div class="col-sm-8"> 
              <input type="text" class="form-control px-2" placeholder="Collected Date" formControlName="pledge_date" (click)="d1.toggle()" ngbDatepicker #d1="ngbDatepicker" onkeydown="return false">
              <div class="col-md-12" *ngIf="submitted && f.pledge_date.errors" class="invalid-feedback">
                <label *ngIf="f.pledge_date.errors.required">Collected date is required</label>
              </div>
            </div>  
          </div>
        </div>
        <div class="col-md-6" [hidden]="isChitSelected">
          <div class="form-group row">
            <label class="col-sm-4">Remark</label>
            <div class="col-sm-8">
              <textarea #remark class="form-control px-2" rows="3" placeholder="Remark" formControlName="remark"></textarea>
            </div>
          </div>
        </div>
      </div>
      <div class="row">&nbsp;</div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/pledge-customer-report']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
