<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Prized Payment</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-commitment-payment']" class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Prized Payment</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form class="bs-example form-horizontal" [formGroup]="AddCommitmentPayment" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Branch Name <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #branch_id formControlName="branch_id" (change)="branchChg($event)">
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                <label *ngIf="f.branch_id.errors.required">Branch is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Employee Name <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #employee_id formControlName="employee_id">
                <option value="">Select Employee Name</option>
                <option *ngFor="let data of employeeList" value="{{data.id}}">{{data.first_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.employee_id.errors" class="invalid-feedback">
                <label *ngIf="f.employee_id.errors.required">Employee Name is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Customer Name <span class="error">*</span></label>
            <div class="col-sm-8">
              <ng-multiselect-dropdown
                  [placeholder]="'Select Customer Name'"
                  [data]="dropdownList"
                  formControlName="customer_id"
                  [settings]="dropdownSettings"
                  (onSelect)="customerChg($event)">
                </ng-multiselect-dropdown>
                <div class="col-md-12" *ngIf="submitted && f.customer_id.errors" class="invalid-feedback">
                  <label *ngIf="f.customer_id.errors.required">Customer Name is required</label>
                </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Slab Type <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #slab_type formControlName="slab_type" (change)="slabTypeChg($event)">
                <option value="">Select Slab Type</option>
                <option *ngFor="let data of slabTypeList" value="{{data.id}}">{{ data | slabAr }}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.slab_type.errors" class="invalid-feedback">
                <label *ngIf="f.slab_type.errors.required">Slab Type is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Payment Date <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #payment_date type="text" formControlName="payment_date" class="form-control calendar" placeholder="Enter Date" [maxDate]=currentDate (click)="d1.toggle()" ngbDatepicker #d1="ngbDatepicker" onkeydown="return false">
              <div class="col-md-12" *ngIf="submitted && f.payment_date.errors" class="invalid-feedback">
                <label *ngIf="f.payment_date.errors.required">Payment Date is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Payment Month <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #payment_month class="form-control" formControlName="payment_month" (change)="paymentMonthChg($event)">
                <option value="">Select Payment Month</option>
                <option *ngFor="let m of paymentMonthOptions" [value]="m.month">
                  Month {{ m.month }} — ₹ {{ m.amount }}
                </option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Total Release Amount</label>
            <div class="col-sm-8">
              <input #total_payment_release	 type="text" class="form-control" placeholder="Enter Total Release Amount"  formControlName="total_payment_release" disabled>
              <div class="col-md-12" *ngIf="submitted && f.total_payment_release.errors" class="invalid-feedback">
                <label *ngIf="f.total_payment_release.errors.required">Total Release Amount is required</label>
                <label *ngIf="f.total_payment_release.errors.pattern">Invalid format</label>
              </div> 
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Given Amount</label>
            <div class="col-sm-8">
              <input #given_amount	 type="text" class="form-control" placeholder="Enter Given Amount"  formControlName="given_amount" disabled>
              <div class="col-md-12" *ngIf="submitted && f.given_amount.errors" class="invalid-feedback">
                <label *ngIf="f.given_amount.errors.required">Given Amount is required</label>
                <label *ngIf="f.given_amount.errors.pattern">Invalid format</label>
              </div> 
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Pending Release</label>
            <div class="col-sm-8">
              <input #pending_release	 type="text" class="form-control" placeholder="Enter Pending Release"  formControlName="pending_release" disabled>
              <input #enrollment_id	 type="hidden" class="form-control" placeholder="Enter Enrollment Id"  formControlName="enrollment_id" disabled>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Payment Release Amount <span class="error">*</span></label>
            <div class="col-sm-8" >
              <input #total_amount	 type="text" class="form-control" placeholder="Enter Payment Release Amount"  formControlName="total_amount" (blur)="onAmtChange($event)">
              <div class="col-md-12" *ngIf="submitted && f.total_amount.errors" class="invalid-feedback">
                <label *ngIf="f.total_amount.errors.required">Payment Release Amount is required</label>
                <label *ngIf="f.total_amount.errors.pattern">Invalid format</label>
              </div> 
              <div class="col-md-12" *ngIf="releaseAmtAlertMsg" class="invalid-feedback">
                  <label>Release amount should less than or equal total pending release</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Payment Type <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #payment_type_id  formControlName="payment_type_id" (change)="paymentChg($event)">
                <option value="">Select Payment Type</option>
                <option value="1">Cash</option>
                <option value="2">Cheque</option>
                <option value="3">D.D</option>
                <option value="4">RTGS/NEFT</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.payment_type_id.errors" class="invalid-feedback">
                <label *ngIf="f.payment_type_id.errors.required">Payment type is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="DebitTo">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Debit To <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #debit_to type="text" class="form-control" placeholder="Debit To" formControlName="debit_to" >
              <div class="col-md-12" *ngIf="submitted && f.debit_to.errors" class="invalid-feedback">
                <label *ngIf="f.debit_to.errors.required">Debit to is required</label>
                <label *ngIf="f.debit_to.errors.pattern">Invaild Pattern</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="ChequeNo">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Cheque No <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #cheque_no type="text" class="form-control" placeholder="Enter Cheque No" formControlName="cheque_no" >
              <div class="col-md-12" *ngIf="submitted && f.cheque_no.errors" class="invalid-feedback">
                <label *ngIf="f.cheque_no.errors.required">Cheque no is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="ChequeDate">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Cheque Date <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #cheque_date type="text" class="form-control" placeholder="Enter Cheque Date" formControlName="cheque_date" (click)="d2.toggle()" ngbDatepicker #d2="ngbDatepicker" onkeydown="return false">
              <div class="col-md-12" *ngIf="submitted && f.cheque_date.errors" class="invalid-feedback">
                <label *ngIf="f.cheque_date.errors.required">Cheque date is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="BankName">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Bank Name <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #bank_id formControlName="bank_id" (change)="bankChg($event)" >
                <option value="">Select Bank</option>
                <option *ngFor="let data of BankList" value="{{data.id}}">{{data.bank_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.bank_id.errors" class="invalid-feedback">
                <label *ngIf="f.bank_id.errors.required">Bank name is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="BranchName">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Branch Name</label>
            <div class="col-sm-8">
              <input #bank_branch_name type="text" class="form-control" formControlName="bank_branch_name" disabled>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="TransactionDate">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Transaction Date <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #transaction_date type="text" class="form-control" placeholder="Enter Transaction Date" formControlName="transaction_date" (click)="d3.toggle()" ngbDatepicker #d3="ngbDatepicker" onkeydown="return false">
              <div class="col-md-12" *ngIf="submitted && f.transaction_date.errors" class="invalid-feedback">
                <label *ngIf="f.transaction_date.errors.required">Transaction date is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="TransactionNo">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Transaction No <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #transaction_no type="text" class="form-control" placeholder="Enter Transaction No" formControlName="transaction_no" >
              <div class="col-md-12" *ngIf="submitted && f.transaction_no.errors" class="invalid-feedback">
                <label *ngIf="f.transaction_no.errors.required">Transaction no is required</label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group row d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-commitment-payment']" class="btn btn-danger mr-1">Cancel</a>
      </div>
    </form>
  </div>
</div>
