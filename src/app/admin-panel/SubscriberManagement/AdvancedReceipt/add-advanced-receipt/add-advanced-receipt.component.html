<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Advanced Receipt Details</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/advanced-receipt-report']" class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i>Advanced Receipt Report</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form class="bs-example form-horizontal" [formGroup]="AddAdvancedReceipt" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <div class="form-group row">
            <label class="col-sm-4">Branch Name <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #branch_id formControlName="branch_id" (change)="branchChg($event)">
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                <label *ngIf="f.branch_id.errors.required">Branch is required</label>
              </div>
            </div>
          </div>
        </div>
        <!--<div class="col-6">
          <div class="form-group row">
            <label class="col-sm-4">Receipt Date<span class="error">*</span></label>
            <div class="col-sm-8">
              <input #receipt_date type="text" formControlName="receipt_date" class="form-control calendar" placeholder="Enter Receipt Date"  [minDate]=currentDate (click)="d1.toggle()" ngbDatepicker #d1="ngbDatepicker" onkeydown="return false">
            </div>
          </div>
        </div>-->
        <div class="col-md-6">
          <div class="form-group row">
              <label class="col-sm-4">Receipt Date <span class="error">*</span> </label>
              <div class="col-sm-8">
                <input #receipt_date type="text" class="form-control col-sm-12" placeholder="Receipt Date" formControlName="receipt_date" [maxDate]=currentDate (click)="d1.toggle()" ngbDatepicker #d1="ngbDatepicker" onkeydown="return false">
              <div class="col-md-12" *ngIf="submitted && f.receipt_date.errors" class="invalid-feedback">
                <label *ngIf="f.receipt_date.errors.required">Receipt date is required</label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <div class="form-group row">
            <label class="col-sm-4">Collected Employee <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #employee_id formControlName="employee_id">
                <option value="">Collected Employee</option>
                <option *ngFor="let data of employeeList" value="{{data.id}}">{{data.first_name}}{{data.last_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.employee_id.errors" class="invalid-feedback">
                <label *ngIf="f.employee_id.errors.required">Employee is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4">Select Customer <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #customer_id class="form-control col-sm-12" formControlName="customer_id" (change)="customerChg($event)">
                <option value="">Select Customer Name</option>
                <option *ngFor="let data of customerList" [value]="data.id">{{ data.full_name }}</option>
              </select>
                <div class="col-md-12" *ngIf="submitted && f.customer_id.errors" class="invalid-feedback">
                  <label *ngIf="f.customer_id.errors.required">Customer Name is required</label>
                </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <div class="form-group row">
            <label class="col-sm-4">Select Enrollment<span class="error">*</span></label>
            <div class="col-sm-8">
              <select #enrollment_id class="form-control col-sm-12"  formControlName="enrollment_id" (change)="enrollChg($event)" >
                <option value="">Select Enrollment</option>
                <option *ngFor="let data of enrollementList" value="{{data.id}}">{{data.enrol_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.enrollment_id.errors" class="invalid-feedback">
                <label *ngIf="f.enrollment_id.errors.required">Enrollment is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideReceiptAmt">
          <div class="form-group row">
            <label class="col-sm-4">Receipt Amount<span class="error">*</span></label>
            <div class="col-sm-8">
              <input #receipt_amount  type="text"  formControlName="receipt_amount" class="form-control calendar" (blur)="onAmtChange($event)">
              <div class="col-md-12" *ngIf="submitted && f.receipt_amount.errors" class="invalid-feedback">
                 <label *ngIf="f.receipt_amount.errors.pattern">Invalid format</label>
                 <label *ngIf="f.receipt_amount.errors.required">Receipt Amount required</label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <div class="form-group row">
            <label class="col-sm-4">Available Advance Amount</label>
            <div class="col-sm-8">
              <input  type="text"  class="form-control calendar" value="{{AdvanceReceiptAmt}}" readonly>
            </div>
          </div>
        </div>
        <div class="col-md-6"  [hidden]="hideTotalAdvanceAmt">
          <div class="form-group row">
            <label class="col-sm-4">Total Advance Amount</label>
            <div class="col-sm-8">
              <input  type="text"  class="form-control calendar"   value="{{TotalAdvanceAmt}}" readonly>
            </div>
          </div>
        </div>
      </div>
      
      <div class="row">
        <div class="col-md-6" [hidden]="hidePayment">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4">Payment Type <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #payment_type_id class="form-control col-sm-12" formControlName="payment_type_id" (change)="paymentChg($event)">
                <option value="">Select Payment Type</option>
                <option value="1">Cash</option>
                <option value="2">Cheque</option>
                <option value="3">D.D</option>
                <option value="4">RTGS/NEFT</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.payment_type_id.errors" class="invalid-feedback">
                <label *ngIf="f.payment_type_id.errors.required">Payment type is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideDebitTo">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4">Debit To <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #debit_to type="text" class="form-control col-sm-12" placeholder="Debit To" formControlName="debit_to">
              <div class="col-md-12" *ngIf="submitted && f.debit_to.errors" class="invalid-feedback">
                <label *ngIf="f.debit_to.errors.required">Debit to is required</label>
                <label *ngIf="f.debit_to.errors.pattern">Invaild Pattern</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideCheque">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4">Cheque No <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #cheque_no type="text" class="form-control col-sm-12" placeholder="Cheque No" formControlName="cheque_no">
              <div class="col-md-12" *ngIf="submitted && f.cheque_no.errors" class="invalid-feedback">
                <label *ngIf="f.cheque_no.errors.required">Cheque no is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideCheque">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4">Cheque Date <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #cheque_date type="text" class="form-control col-sm-12" placeholder="Cheque Date" (click)="d2.toggle()" ngbDatepicker #d2="ngbDatepicker" onkeydown="return false" formControlName="cheque_date">
              <div class="col-md-12" *ngIf="submitted && f.cheque_date.errors" class="invalid-feedback">
                <label *ngIf="f.cheque_date.errors.required">Cheque date is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideBank">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4">Bank <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #bank_id  class="col-sm-12" formControlName="bank_id" (change)="bankChg($event)">
                <option value="">Select Bank</option>
                <option *ngFor="let data of bankList" value="{{data.id}}">{{data.bank_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.bank_id.errors" class="invalid-feedback">
                <label *ngIf="f.bank_id.errors.required">Bank is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideBank">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4">Branch Name</label>
            <div class="col-sm-8">
              <input #bank_branch_name type="text" class="form-control col-sm-12" placeholder="Branch Name" formControlName="bank_branch_name" disabled>
              <div class="col-md-12" *ngIf="submitted && f.bank_branch_name.errors" class="invalid-feedback">
                <label *ngIf="f.bank_branch_name.errors.required">Bank branch is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideTransaction">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4">Transaction Date <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #transaction_date type="text" class="form-control col-sm-12" placeholder="Transaction Date" (click)="d3.toggle()" ngbDatepicker #d3="ngbDatepicker" onkeydown="return false" formControlName="transaction_date">
              <div class="col-md-12" *ngIf="submitted && f.transaction_date.errors" class="invalid-feedback">
                <label *ngIf="f.transaction_date.errors.required">Transaction date is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6" [hidden]="hideTransaction">
          <div class="form-group row">
            <label for="exampleFormControlSelect1" class="col-sm-4">Transaction No <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #transaction_no type="text"  class="form-control col-sm-12" placeholder="Transaction No" formControlName="transaction_no">
              <div class="col-md-12" *ngIf="submitted && f.transaction_no.errors" class="invalid-feedback">
                <label *ngIf="f.transaction_no.errors.required">Transaction no is required</label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/advanced-receipt-report']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
