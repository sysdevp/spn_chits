<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Update Account Group</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-accounting-group']"  class="bg-primary border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Account Group</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze ">
    <form class="bs-example form-horizontal" [formGroup]="UpdateAccountingGroup" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Parent Group <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #under formControlName="under">
            <option value="">Select Parent Group</option>
            <option value="Cash">Cash</option>
            <option value="Bank">Bank</option>
            <option value="Incomes">Incomes</option>
            <option value="Expenses">Expenses</option>
            <option value="Asset">Asset</option>
            <option value="Liabilities">Liabilities</option>
            <option *ngFor="let data of underList" value="{{data.group_name}}">{{data.group_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.under.errors" class="invalid-feedback">
            <label *ngIf="f.under.errors.required">Under  is required</label>
          </div> 
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Group Name<span class="error">*</span></label>
        <div class="col-sm-10">
          <input #group_name type="text" class="form-control px-2" placeholder="Enter Group Name" formControlName="group_name">
          <div class="col-md-12" *ngIf="submitted && f.group_name.errors" class="invalid-feedback">
            <label *ngIf="f.group_name.errors.required">Group Name  is required</label>
          </div> 
        </div>
      </div> 
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Remarks</label>
        <div class="col-sm-10">
          <textarea #remarks class="form-control px-2" placeholder="Enter Remarks" rows="3" formControlName="remarks"></textarea>
        </div>
      </div>
      <div class="form-group row ">
        <div class="offset-md-2 offset-sm-2 col-sm-10 col-md-7 col-12">
          <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
          <a [routerLink]="['/admin-panel/view-accounting-group']" class="btn btn-danger mr-1">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
