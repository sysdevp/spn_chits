<ng-template #uploadModal let-c="close" let-d="dismiss">
	<div class="modal-header without-text">
		<h5 class="float-left px-2 py-2 text-white mb-0">Account Group</h5>
		<button type="button" class="btn btn-default bg-white modal-close-btn float-right mx-3 rounded-circle py-2 px-3 " id="myDiv" (click)="c('Close click')">X</button>
	</div>
	<div class="modal-body">
		<div class="card-body">
			<div class="row">
				<div class="col-md-6">
					<div class="form-group">
						<label class="form-label">Group Name: </label>
						<b class="px-1">{{viewAccountGroupInfo.group_name}}</b>
					</div>
				</div>
				<div class="col-md-6">
					<div class="form-group">
						<label class="form-label">Parent Group Name: </label>
						<b class="px-1">{{viewAccountGroupInfo.under}}</b>
					</div>
				</div>
				<div class="col-md-6">
					<div class="form-group">
						<label class="form-label">Remarks : </label>
						<b class="px-1">{{viewAccountGroupInfo.remarks}}  </b>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="modal-footer"></div>
</ng-template>

<div class="card maz-vh">
	<div class="card-header">
		<div class="row">
			<div class="col-6 my-auto font-weight-bold">Account Group</div>
			<div class="col-6 text-right">
				<a [routerLink]="['/admin-panel/add-accounting-group']"  class="bg-success border-0 text-white px-3 py-2"> + Add Account Group </a>
			</div>
		</div>
	</div>
	<div class="card-body">
		<div [hidden]="TableHidden">
			<table id="dtable"  class="row-border hover">
				<thead>
					<tr> 
						<th>SNo</th>
						<th>Parent Group Name</th>
						<th>Group Name</th>
						
						<th>Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr *ngFor="let row of dataList;">
						<td>{{row.sno}}</td>
						<td>{{row.under}}</td>
						<td>{{row.group_name}}</td>
						
						<td>  
							<a (click)="open(uploadModal, { windowClass: 'modal-lg animate' }, row.id)"><i class="fas fa-eye text-success"></i></a>
							<a [routerLink]="['/admin-panel/update-accounting-group/'+row.id]"><i class="fas fa-edit text-primary mx-2"></i></a>
							<a [routerLink]="['/admin-panel/delete-accounting-group/'+row.id]"><i class="fas fa-trash-alt text-danger"></i></a>
							<!--<a *ngIf="row.status==1" (click)="changeStatus(row.id,0)" style="margin-left:5%;cursor:pointer;" title="Deactivate Petty Cash Expense Type"><i class="fas fa-check-circle text-success"></i></a>
							<a *ngIf="row.status==0" (click)="changeStatus(row.id,1)" style="margin-left:5%;cursor:pointer;" title="Activate Petty Cash Expense Type"><i class="fas fa-ban text-danger"></i></a>-->
						</td>
					</tr>
				</tbody>
			</table>
		</div>
		<div *ngIf="TableHidden==true" class="table-loader" > 
			<img style="width: 120px;margin: 20% auto;display: block;" src="assets/img/loading.gif"/>
		</div>
	</div>
</div>
