<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Lawyer Name</div>
        <div class="col-6 text-right">
          <a [routerLink]="['/admin-panel/view-lawyer']"  class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Lawyer Name</a>
        </div>
    </div>
  </div>
  <div class="card-body add-maze ">
    <form class="bs-example form-horizontal" [formGroup]="AddLawyer" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>     
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Lawyer Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <input #lawyer_name type="text" class="form-control px-2" placeholder="Enter Lawyer Name" formControlName="lawyer_name">
          <div class="col-md-12" *ngIf="submitted && f.lawyer_name.errors" class="invalid-feedback">
            <label *ngIf="f.lawyer_name.errors.required">Lawyer name is required</label>
          </div> 
        </div>
      </div> 
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Commission % <span class="error">*</span></label>
        <div class="col-sm-10">
          <input #lawyer_percentage type="text" class="form-control px-2" placeholder="Enter Commission %" formControlName="lawyer_percentage">
          <div class="col-md-12" *ngIf="submitted && f.lawyer_percentage.errors" class="invalid-feedback">
            <label *ngIf="f.lawyer_percentage.errors.required">Lawyer Percentage is required</label>
          </div> 
        </div>
      </div> 
        <div class="form-group row">
          <label class="col-sm-2 col-form-label">Mobile Number <span class="error">*</span></label>
          <div class="col-sm-10">
          <input #mobile_no type="text" class="form-control" placeholder="Enter Mobile Number" formControlName="mobile_no" (input)="onKeyUpMobile($event)">
          <div class="col-md-12" *ngIf="(submitted && f.mobile_no.errors) || (!isValidMobile)" class="invalid-feedback">
            <label *ngIf="f.mobile_no.errors.required">Mobile Number is required</label>
            <label *ngIf="(f.mobile_no.errors.pattern) || (!isValidMobile)">Invalid Mobile number</label></div> 
          </div>
        </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Remarks</label>
        <div class="col-sm-10">
          <textarea #remarks class="form-control px-2" placeholder="Remarks" rows="3" formControlName="remarks"></textarea>
        </div>
      </div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-lawyer']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
