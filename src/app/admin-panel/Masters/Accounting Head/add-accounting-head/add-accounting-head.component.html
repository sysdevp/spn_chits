<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Account Head</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-accounting-head']"  class="bg-primary border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Account Head</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze ">
    <form class="bs-example form-horizontal" [formGroup]="AddAccountingHead" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">Branch <span class="error">*</span></label>
            <div class="col-sm-10">
              <select #branch_id formControlName="branch_id" >
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                <label *ngIf="f.branch_id.errors.required">Branch is required</label>
              </div>
            </div>
          </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Head Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <input #name type="text" class="form-control px-2" placeholder="Enter Head Name " formControlName="name">
          <div class="col-md-12" *ngIf="submitted && f.name.errors" class="invalid-feedback">
            <label *ngIf="f.name.errors.required">Head Name  is required</label>
          </div> 
        </div>
      </div> 
      <div class="form-group row">
        <label class="col-sm-2  col-form-label">Group Name <span class="error">*</span></label>
        <div class="col-sm-10 ">
          <select #group_id formControlName="group_id" (change)="grpChg($event)">
            <option value="">Select Group</option>
            <option *ngFor="let data of groupList" value="{{data.id}}">{{data.group_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.group_id.errors" class="invalid-feedback">
            <label *ngIf="f.group_id.errors.required">Group Name is required</label>
          </div>
        </div>
      </div>
      <div class="form-group row" [hidden]="openingBalance">
        <label class="col-sm-2  col-form-label">Opening Balance <span class="error">*</span></label>
        <div class="col-sm-5 ">
              <input #amount type="text" class="form-control col-sm-12" placeholder=" Amount" formControlName="amount" >
              <div class="col-md-12" *ngIf="submitted && f.amount.errors" class="invalid-feedback">
                <label *ngIf="f.amount.errors.required"> Amount is required</label>
                <label *ngIf="f.amount.errors.pattern">Invalid format</label>
              </div>
        </div>
        <div class="col-sm-5 " [hidden]="openingBalance">
          <select #collection_type formControlName="collection_type">
            <option value="0">Type</option>
            <option value="Credit">Credit</option>
            <option value="Debit">Debit</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.collection_type.errors" class="invalid-feedback">
            <label *ngIf="f.collection_type.errors.required">Type is required</label>
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Remarks</label>
        <div class="col-sm-10">
          <textarea #remarks class="form-control px-2" placeholder="Enter Remarks" rows="3" formControlName="remarks"></textarea>
        </div>
      </div>
      <div class="form-group row ">
        <div class="offset-md-2 offset-sm-2 col-sm-10 col-md-7 col-12">
          <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
          <a [routerLink]="['/admin-panel/view-accounting-head']" class="btn btn-danger mr-1">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
