<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Penalty Slab</div>
      <div class="col-6 text-right">
        <a
          [routerLink]="['/admin-panel/view-penalty-slab']"
          class="bg-info border-0 text-white px-3 py-2"
        >
          <i class="fas fa-eye pr-2"></i> View Penalty Slab</a
        >
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form
      class="bs-example form-horizontal"
      [formGroup]="AddPenaltySlab"
      (ngSubmit)="onSubmit()"
    >
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label"
          >Company Name <span class="error">*</span></label
        >
        <div class="col-sm-6">
          <select
            #tenant_id
            formControlName="tenant_id"
            (change)="companyChg($event)"
          >
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{ data.id }}">
              {{ data.chit_fund_name }}
            </option>
          </select>
          <div
            class="col-md-12"
            *ngIf="submitted && f.tenant_id.errors"
            class="invalid-feedback"
          >
            <label *ngIf="f.tenant_id.errors.required"
              >Company is required</label
            >
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label"
          >Branch <span class="error">*</span></label
        >
        <div class="col-sm-6 d-flex">
          <select #branch_id formControlName="branch_id">
            <option value="">Select Branch</option>
            <option *ngFor="let data of branchList" value="{{ data.id }}">
              {{ data.branch_name }}
            </option>
          </select>
          <div class="ps-2">
            <a
              [routerLink]="['/admin-panel/add-branch']"
              target="_blank"
              class="btn btn-primary"
            >
              <span>+</span>
            </a>
          </div>
        </div>
        <div
          class="col-md-12"
          *ngIf="submitted && f.branch_id.errors"
          class="invalid-feedback"
        >
          <label *ngIf="f.branch_id.errors.required">Branch is required</label>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label"
          >Scheme <span class="error">*</span></label
        >
        <div class="col-sm-6 d-flex">
          <select
            #scheme_id
            formControlName="scheme_id"
            (change)="schemeChg($event)"
          >
            <option value="">Select Scheme</option>
            <option *ngFor="let data of schemeList" value="{{ data.id }}">
              {{ data.scheme_format }}
            </option>
          </select>

          <div class="ps-2">
            <a
              [routerLink]="['/admin-panel/add-scheme']"
              target="_blank"
              class="btn btn-primary"
            >
              <span>+</span>
            </a>
          </div>
        </div>
        <div
          class="col-md-12"
          *ngIf="submitted && f.scheme_id.errors"
          class="invalid-feedback"
        >
          <label *ngIf="f.scheme_id.errors.required"
            >Scheme name is required</label
          >
        </div>
      </div>

      <div class="mb-3" [hidden]="penaltySlab">
        <h6 class="mb-3 border-bottom pb-2">Penalty Slabs</h6>
        <div class="table-responsive">
          <table class="table table-bordered align-middle">
            <thead class="table-light">
              <tr>
                <th>Level</th>
                <th>Penalty %</th>
                <th>Penalty Days From</th>
                <th>Penalty Days To</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Level 1</td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level_1_percentage"
                    placeholder="Enter %"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level1_from"
                    placeholder="Enter From"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level1_to"
                    placeholder="Enter To"
                  />
                </td>
              </tr>
              <tr>
                <td>Level 2</td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level_2_percentage"
                    placeholder="Enter %"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level2_from"
                    placeholder="Enter From"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level2_to"
                    placeholder="Enter To"
                  />
                </td>
              </tr>
              <tr>
                <td>Level 3</td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level_3_percentage"
                    placeholder="Enter %"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level3_from"
                    placeholder="Enter From"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level3_to"
                    placeholder="Enter To"
                  />
                </td>
              </tr>
              <tr>
                <td>Level 4</td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level_4_percentage"
                    placeholder="Enter %"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level4_from"
                    placeholder="Enter From"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level4_to"
                    placeholder="Enter To"
                  />
                </td>
              </tr>
              <tr>
                <td>Level 5</td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level_5_percentage"
                    placeholder="Enter %"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level5_from"
                    placeholder="Enter From"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="level5_to"
                    placeholder="Enter To"
                  />
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="form-group row d-flex justify-content-center">
        <button
          type="submit"
          class="btn btn-primary mr-1"
          [disabled]="disableBtn"
        >
          {{ SubmitbuttonName }}
        </button>
        <a
          [routerLink]="['/admin-panel/view-penalty-slab']"
          class="btn btn-danger mr-1"
          >Cancel</a
        >
      </div>
    </form>
  </div>
</div>
