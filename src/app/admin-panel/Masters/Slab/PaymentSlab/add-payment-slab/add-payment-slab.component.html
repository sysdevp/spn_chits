<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Payment Slab</div>
      <div class="col-6 text-right">
        <a
          [routerLink]="['/admin-panel/view-payment-slab']"
          class="bg-success border-0 text-white px-3 py-2"
        >
          <i class="fas fa-eye pr-2"></i> View Payment Slab</a
        >
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form
      class="bs-example form-horizontal"
      [formGroup]="AddPaymentSlab"
      (ngSubmit)="onSubmit()"
    >
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label"
          >Company Name <span class="error">*</span></label
        >
        <div class="col-sm-6">
          <select
            #tenant_id
            formControlName="tenant_id"
            (change)="companyChg($event)"
          >
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{ data.id }}">
              {{ data.chit_fund_name }}
            </option>
          </select>
          <div
            class="col-md-12"
            *ngIf="submitted && f.tenant_id.errors"
            class="invalid-feedback"
          >
            <label *ngIf="f.tenant_id.errors.required"
              >Company is required</label
            >
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label"
          >Branch <span class="error">*</span></label
        >
        <div class="col-sm-6 d-flex">
          <select formControlName="branch_id" (change)="branchChg($event)">
            <option value="">Select Branch</option>
            <option *ngFor="let data of branchList" value="{{ data.id }}">
              {{ data.branch_name }}
            </option>
          </select>
          <div class="ps-2">
            <a
              [routerLink]="['/admin-panel/add-branch']"
              target="_blank"
              class="btn btn-primary"
            >
              <span>+</span>
            </a>
          </div>
        </div>
        <div
          class="col-md-12"
          *ngIf="submitted && f.branch_id.errors"
          class="invalid-feedback"
        >
          <label *ngIf="f.branch_id.errors.required">Branch is required</label>
        </div>
      </div>
      <div class="form-group row" [hidden]="chitValue">
        <label class="col-sm-2 col-form-label"
          >Scheme <span class="error">*</span></label
        >
        <div class="col-sm-6 d-flex">
          <select formControlName="schemes_id" (change)="schemeChg($event)">
            <option value="">Select Scheme</option>
            <option *ngFor="let data of schemeList" value="{{ data.id }}">
              {{ data.scheme_format }}
            </option>
          </select>
          <div class="ps-2">
            <a
              [routerLink]="['/admin-panel/add-scheme']"
              target="_blank"
              class="btn btn-primary"
            >
              <span>+</span>
            </a>
          </div>
        </div>
        <div
          class="col-md-12"
          *ngIf="submitted && f.schemes_id.errors"
          class="invalid-feedback"
        >
          <label *ngIf="f.schemes_id.errors.required"
            >Chit value is required</label
          >
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label"
          >Slab <span class="error">*</span></label
        >
        <div class="col-sm-6">
          <select #slab_id formControlName="slab_id">
            <option value="">Select Slab</option>
            <option *ngFor="let data of dueList" value="{{ data.id }}">
              {{ data.slab_name }}
            </option>
          </select>
          <div
            class="col-md-12"
            *ngIf="submitted && f.slab_id.errors"
            class="invalid-feedback"
          >
            <label *ngIf="f.slab_id.errors.required"
              >Slab Name is required</label
            >
          </div>
        </div>
      </div>
      <div class="p-1 mb-3 bg-light border-start border-3 border-primary">
        <h5 class="mb-0 text-info">Payment Amount</h5>
      </div>

      <div class="form-group row" [hidden]="paymentList">
        <div *ngFor="let item of arrayOne(noOfMonths); let i = index">
          <div class="col-sm-12">
            <label class="col-form-label">Payment - {{ i + 1 }} </label>
            <input
              type="text"
              class="form-control"
              name="payment_{{ i + 1 }}"
              formControlName="payment_{{ i + 1 }}"
            />
          </div>
        </div>
      </div>
      <div class="form-group d-flex justify-content-center">
        <button
          type="submit"
          class="btn btn-primary mr-1"
          [disabled]="disableBtn"
        >
          {{ SubmitbuttonName }}
        </button>
        <a
          [routerLink]="['/admin-panel/view-payment-slab']"
          class="btn btn-danger mr-1"
          >Cancel</a
        >
      </div>
    </form>
  </div>
</div>
