<div class="card">
  <div class="card-header"> 
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add State</div>
        <div class="col-6 text-right">
          <a [routerLink]="['/admin-panel/view-state']"  class="bg-success border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View State</a>
        </div>
      </div>  
  </div>
  <div class="card-body">
    <form class="bs-example form-horizontal" [formGroup]="AddState" (ngSubmit)="onSubmit()">
      <div class="form-group row">
        <label class="col-sm-2 col-md-2 col-3 col-form-label">Country <span class="error">*</span></label>
        <div class="col-sm-10 col-md-7 col-9">
          <select #country_id class="form-control form-control w-100 border-dark" formControlName="country_id">
            <option value="">Select Country</option>
            <option *ngFor="let data of CountryList" value="{{data.id}}">{{data.country_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.country_id.errors" class="invalid-feedback">
            <label *ngIf="f.country_id.errors.required">Country is required</label>
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-md-2 col-sm-4 col-3">State<span class="error">*</span></label>
        <div class="col-sm-10 col-md-7 col-9">
        <input #state_name type="text" class="form-control" placeholder="State" formControlName="state_name">
        <div class="col-md-12" *ngIf="submitted && f.state_name.errors" class="invalid-feedback">
          <label *ngIf="f.state_name.errors.required">State name is required</label>
        </div> 
      </div>
      </div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-state']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
