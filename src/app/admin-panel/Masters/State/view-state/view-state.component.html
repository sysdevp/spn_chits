<div class="card maz-vh">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">State Details</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/add-state']"  class="bg-success border-0 text-white px-3 py-2"> + Add State </a>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div [hidden]="TableHidden">
      <table id="dtable"  class="row-border hover">
        <thead>
          <tr> 
            <th>SNo</th>
            <th>Country Name</th>
            <th>State Name</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of dataList;">
            <td>{{row.sno}}</td>
            <td>{{row.country_name}}</td>
            <td>{{row.state_name}}</td>
            <td>  
              <a [routerLink]="['/admin-panel/update-state/'+row.id]"><i class="fas fa-edit text-primary mx-2"></i></a>
              <a *ngIf="row.is_delete==0" [routerLink]="['/admin-panel/delete-state/'+row.id]"><i class="fas fa-trash-alt text-danger"></i></a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div *ngIf="TableHidden==true" class="table-loader" > 
      <img style="width: 120px;margin: 20% auto;display: block;" src="assets/img/loading.gif"/>
    </div>
  </div>
</div>
