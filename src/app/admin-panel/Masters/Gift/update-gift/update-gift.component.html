<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Update Gift</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-gift']" class="bg-success border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Gift</a>
      </div>
      </div>
    </div>
    <div class="card-body add-maze ">
      <form class="bs-example form-horizontal" [formGroup]="UpdateCity" (ngSubmit)="onSubmit()">
        <div class="form-group row">
          <label class="col-sm-2 col-md-2 col-3 col-form-label">Select Scheme <span class="error">*</span></label>
          <div class="col-sm-10 col-md-7 col-9">
            <select #scheme_id class="form-control form-control w-100 border-dark" formControlName="scheme_id">
              <option value="">Select Scheme</option>
              <option *ngFor="let data of districtList" value="{{data.id}}">{{data.district_name}}</option>
            </select>
            <div class="col-md-12" *ngIf="submitted && f.district_id.errors" class="invalid-feedback">
              <label *ngIf="f.district_id.errors.required">Scheme is required</label>
            </div>
          </div>
        </div>
        <div class="form-group row">
          <label class="col-sm-2 col-md-2 col-3 col-form-label">Gift Name <span class="error">*</span></label>
          <div class="col-sm-10 col-md-7 col-9">
            <input #gift_name type="text" class="form-control" placeholder="Enter Gift Name" formControlName="gift_name" >
            <div class="col-md-12" *ngIf="submitted && f.gift_name.errors" class="invalid-feedback">
              <label *ngIf="f.gift_name.errors.required">Gift name is required</label>
            </div>
          </div>
        </div>
        <div class="form-group row">
          <label class="col-sm-2 col-md-2 col-3 col-form-label">Price <span class="error">*</span></label>
          <div class="col-sm-10 col-md-7 col-9 w">
            <input #price type="text" class="form-control" placeholder="Enter Price" formControlName="price">
            <div class="col-md-12" *ngIf="submitted && f.price.errors" class="invalid-feedback">
              <label *ngIf="f.price.errors.required">Price is required</label>
            </div>  
          </div>
        </div>\
        <div class="form-group row">
          <label class="col-sm-2 col-md-2 col-3 col-form-label">Quantity <span class="error">*</span></label>
          <div class="col-sm-10 col-md-7 col-9 w">
            <input #quantity type="text" class="form-control" placeholder="Enter Quantity" formControlName="quantity">
            <div class="col-md-12" *ngIf="submitted && f.quantity.errors" class="invalid-feedback">
              <label *ngIf="f.quantity.errors.required">Quantity is required</label>
            </div>  
          </div>
        </div>
        <div class="form-group d-flex justify-content-center">
          <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
          <a [routerLink]="['/admin-panel/view-city']" class="btn btn-danger mr-1">Cancel</a>
        </div> 
    </form>
  </div>
</div>
