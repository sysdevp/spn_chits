<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add SMS Template</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-sms-content']" class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View SMS Template</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form class="bs-example form-horizontal" [formGroup]="AddSmsTemplate" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <div class="form-group row">
            <label class="col-sm-4">Branch Name <span class="error">*</span></label>
            <div class="col-sm-8">
              <select #branch_id formControlName="branch_id">
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                <label *ngIf="f.branch_id.errors.required">Branch is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group row">
            <label class="col-sm-4">Template Name <span class="error">*</span></label>
            <div class="col-sm-8">
              <input #template_name type="text" class="form-control px-2" placeholder="Enter Template Name" formControlName="template_name">
              <div class="col-md-12" *ngIf="submitted && f.template_name.errors" class="invalid-feedback">
                <label *ngIf="f.template_name.errors.required">Template Name is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group row">
            <label class="col-sm-4">Description</label>
            <div class="col-sm-8">
              <textarea #description class="form-control px-2" placeholder="Enter Description" rows="3" formControlName="description"></textarea>
              <div class="col-md-12" *ngIf="submitted && f.description.errors" class="invalid-feedback">
                <label *ngIf="f.description.errors.required">Description is required</label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-sms-content']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
