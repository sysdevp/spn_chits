<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Collection Area</div>
        <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-collection-area']" class="bg-info border-0 text-white px-3 py-2"><i class="fas fa-eye pr-2"></i>View Collection Area</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze ">
    <form class="bs-example form-horizontal" [formGroup]="AddCollectionArea" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Branch <span class="error">*</span></label>
        <div class="col-sm-6">
          <select #branch_id formControlName="branch_id">
            <option value="">Select Branch</option>
            <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
            <label *ngIf="f.branch_id.errors.required">Branch name is required</label>
          </div> 
        </div>
      </div> 
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Collection Area  <span class="error">*</span></label>
        <div class="col-sm-6">
          <input #collection_area type="text" class="form-control px-2" placeholder="Enter Collection Area" formControlName="collection_area">
          <div class="col-md-12" *ngIf="submitted && f.collection_area.errors" class="invalid-feedback">
            <label *ngIf="f.collection_area.errors.required">Collection area name is required</label>
          </div> 
        </div>
      </div> 
      <div class="form-group row">
        <label class="col-sm-2 col-form-label"> Pincode<span class="error"></span></label>
        <div class="col-sm-6">
          <input #area_pincode type="text" class="form-control px-2" placeholder="Enter Pincode" formControlName="area_pincode">
          <div class="col-md-12" *ngIf="submitted && f.area_pincode.errors" class="invalid-feedback">
            <label *ngIf="f.area_pincode.errors.required">Area Pincode is required</label>
            <label *ngIf="f.area_pincode.errors.pattern">Invalid pattern</label>
          </div> 
        </div>
      </div> 
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-collection-area']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
