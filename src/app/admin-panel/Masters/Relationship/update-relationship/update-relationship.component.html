<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Update Relationship</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-relationship']" class="bg-success border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Relationship</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze ">
    <form class="bs-example form-horizontal" [formGroup]="UpdateRelationship" (ngSubmit)="onSubmit()">
      <div class="form-group row">
        <label class="col-sm-2 col-md-2 col-3 col-form-label">Relationship  <span class="error">*</span></label>
        <div class="col-sm-10 col-md-7 col-9">
          <input #relationship_name type="text" class="form-control" placeholder="Relationship (Example: Father, Mother, etc)" formControlName="relationship_name" >
          <div class="col-md-12" *ngIf="submitted && f.relationship_name.errors" class="invalid-feedback">
            <label *ngIf="f.relationship_name.errors.required">Relationship name is required</label>
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-md-2 col-3 col-form-label">Gender <span class="error">*</span></label>
        <div class="col-sm-10 col-md-7 col-9 w">
          <select #gender formControlName="gender" >
            <option value="">Select Gender</option>
            <option value="male">Male </option>
            <option value="female">Female </option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.gender.errors" class="invalid-feedback">
            <label *ngIf="f.gender.errors.required">Relationship gender is required</label>
          </div>  
        </div>
      </div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-relationship']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
