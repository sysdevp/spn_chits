<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Update Designation</div>
        <div class="col-6 text-right">
          <a [routerLink]="['/admin-panel/view-role']"  class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Designation</a>
        </div>
    </div>
  </div>
  <div class="card-body add-maze ">
    <form class="bs-example form-horizontal" [formGroup]="UpdateDesignation" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Designation  <span class="error">*</span></label>
        <div class="col-sm-6">
          <input #designation_name type="text" class="form-control px-2" placeholder="Enter Designation Name" formControlName="designation_name">
          <div class="col-md-12" *ngIf="submitted && f.designation_name.errors" class="invalid-feedback">
            <label *ngIf="f.designation_name.errors.required">Designation name is required</label>
          </div> 
        </div>
      </div> 
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Remarks</label>
        <div class="col-sm-6">
          <textarea #remarks class="form-control px-2" placeholder="Remarks" rows="3" formControlName="remarks"></textarea>
        </div>
      </div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-designation']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
