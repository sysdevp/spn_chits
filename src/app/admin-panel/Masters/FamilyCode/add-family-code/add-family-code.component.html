<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Family Code</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-family-code']" class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Family Code</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form class="bs-example form-horizontal" [formGroup]="AddFamilyCode" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <div class="form-group row">
            <label class="col-sm-2">Branch  <span class="error">*</span></label>
            <div class="col-sm-6">
              <select #branch_id formControlName="branch_id">
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                <label *ngIf="f.branch_id.errors.required">Branch is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="form-group row">
            <label class="col-sm-2">Family Code <span class="error">*</span></label>
            <div class="col-sm-6">
              <input #family_code type="text" class="form-control px-2" placeholder="Enter Family Code" formControlName="family_code">
              <div class="col-md-12" *ngIf="submitted && f.family_code.errors" class="invalid-feedback">
                <label *ngIf="f.family_code.errors.required">Family Code is required</label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-family-code']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
