<ng-template #uploadModal let-c="close" let-d="dismiss">
  <div class="modal-header without-text">
    <h5 class="float-left px-2 py-2 text-white mb-0">Family Code Detail</h5>
    <button type="button" class="btn btn-default bg-white modal-close-btn float-right mx-3 rounded-circle py-2 px-3 " id="myDiv" (click)="c('Close click')">X</button>
  </div>
  <div class="modal-body">
    <div class="card-body">
      <form class="bs-example form-horizontal">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Branch : </label>
              <b class="px-1">{{branchInfo.branch_name}}</b>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Family Code: </label>
              <b class="px-1">{{viewRoleInfo.family_code}} </b>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div class="modal-footer"></div>
</ng-template>
<div class="card maz-vh">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Family Code List</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/add-family-code']" class="bg-success border-0 text-white px-3 py-2"> + Add Family Code </a>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div [hidden]="TableHidden">
      <table id="dtable" class="row-border hover">
        <thead>
          <tr> 
            <th>SNo</th>
            <th>Branch </th>
            <th>Family Code</th>
            <th>Members</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of dataList;">
            <td>{{row.sno}}</td>
            <td>{{row.branch_name}}</td>
            <td>{{row.family_code}}</td>
            <td>{{row.member_count || 0}}</td>
            <td>  
              <a (click)="open(uploadModal, { windowClass: 'modal-lg animate' }, row.id)"><i class="fas fa-eye text-success"></i></a>
              <a [routerLink]="['/admin-panel/update-family-code/'+row.id]"><i class="fas fa-edit text-primary mx-2"></i></a>
              <a [routerLink]="['/admin-panel/delete-family-code/'+row.id]"><i class="fas fa-trash-alt text-danger"></i></a>
              <!--<a *ngIf="row.status==1" (click)="changeStatus(row.id,0)" style="margin-left:5%;cursor:pointer;" title="Deactivate Role"><i class="fas fa-check-circle text-success"></i></a>
              <a *ngIf="row.status==0" (click)="changeStatus(row.id,1)" style="margin-left:5%;cursor:pointer;" title="Activate Role"><i class="fas fa-ban text-danger"></i></a>-->
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div *ngIf="TableHidden==true" class="table-loader" > 
      <img style="width: 120px;margin: 20% auto;display: block;" src="assets/img/loading.gif"/>
    </div>
  </div>
</div>
