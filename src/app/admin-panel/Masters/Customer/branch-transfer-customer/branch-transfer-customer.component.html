<div class="container-fluid flex-grow-1 container-p-y">
  <h4 class="font-weight-bold py-3 mb-0">Branch Transfer Customer</h4>
  <div class="card mb-4">
    <div class="card-body">
      <form [formGroup]="TransferForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Customer <span class="error">*</span></label>
            <select
              #customer_id
              class="form-control"
              formControlName="customer_id"
              (change)="customerChg($event)"
            >
              <option value="">Select Customer</option>
              <option *ngFor="let c of customerList" [value]="c.id">
                {{ c.formatted_name || c.name }}
              </option>
            </select>
            <div *ngIf="submitted && f.customer_id.errors" class="text-danger small">
              Customer is required
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label>Current Branch</label>
            <input class="form-control" formControlName="from_branch_name" />
          </div>

          <div class="col-md-6 mb-3">
            <label>New Branch <span class="error">*</span></label>
            <select class="form-control" formControlName="to_branch_id">
              <option value="">Select Branch</option>
              <option *ngFor="let b of branchList" [value]="b.id">
                {{ b.branch_name }}
              </option>
            </select>
            <div *ngIf="submitted && f.to_branch_id.errors" class="text-danger small">
              New branch is required
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label>Transfer Date</label>
            <input type="date" class="form-control" formControlName="transfer_date" />
          </div>

          <div class="col-md-12 mb-3">
            <label>Remarks <span class="error">*</span></label>
            <textarea
              class="form-control"
              rows="3"
              formControlName="remarks"
              placeholder="Reason for branch transfer"
            ></textarea>
            <div *ngIf="submitted && f.remarks.errors" class="text-danger small">
              Remarks are required (min 3 characters)
            </div>
          </div>
        </div>

        <div class="alert alert-info">
          This will update <strong>customer</strong>, <strong>chit_details</strong>,
          <strong>before_enrol_receipts</strong>, <strong>receipts</strong> and
          <strong>commitment_auctions</strong> to the new branch.
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="disableBtn">
          {{ SubmitbuttonName }}
        </button>
        <a
          [routerLink]="['/admin-panel/branch-transfer-customer-report']"
          class="btn btn-outline-secondary ml-2"
          >View Report</a
        >
        <a [routerLink]="['/admin-panel/view-customer']" class="btn btn-danger ml-2"
          >Cancel</a
        >
      </form>
    </div>
  </div>
</div>
