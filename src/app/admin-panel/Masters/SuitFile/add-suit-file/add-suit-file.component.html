<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Update Suit File</div>
      <div class="col-6 text-right">
        <!--<a [routerLink]="['/admin-panel/view-documents']"  class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Document Details</a>-->
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form class="bs-example form-horizontal" [formGroup]="UpdateSuitFile" (ngSubmit)="onSubmit()">
      <div class="row col-sm-12">
       <div class="col-md-12 px-0">
         
        <div class="form-group row" [hidden]="!isSuperAdmin">
          <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
          <div class="col-sm-10">
            <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)" disabled>
              <option value="">Select Company</option>
              <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
            </select>
            <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
              <label *ngIf="f.tenant_id.errors.required">Company is required</label>
            </div>
          </div>
        </div>
     
          </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group row">
              <label class="col-sm-4 col-form-label">Branch Name <span class="error">*</span></label>
              <div class="col-sm-8">
                <select formControlName="branch_id" class="readonlycolor" (change)="branchChg($event)" disabled>
                  <option value="">Select Branch</option>
                  <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
                </select>
                <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                  <label *ngIf="f.branch_id.errors.required">Branch is required</label>
                </div>
              </div>
            </div> 
          </div>
          <div class="col-md-6">
            <div class="form-group row">
              <label class="col-sm-4">Customer Name <span class="error">*</span></label>
              <div class="col-sm-8">
                <select (change)="customerChg($event)" class="readonlycolor"  formControlName="customer_id" disabled>
                  <option value="">Select Customer</option>
                  <option *ngFor="let data of customerList" value="{{data.id}}">{{data.name}}</option>
                </select>
                <div class="col-md-12" *ngIf="submitted && f.customer_id.errors" class="invalid-feedback">
                  <label *ngIf="f.customer_id.errors.required">Customer is required</label>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group row">
              <label class="col-sm-4">Lawyer Name <span class="error">*</span></label>
              <div class="col-sm-8">
                <select   formControlName="lawyer_id" >
                  <option value="">Select Lawyer Name</option>
                  <option *ngFor="let data of lawyerList" value="{{data.id}}">{{data.lawyer_name}}</option>
                </select>
                <div class="col-md-12" *ngIf="submitted && f.lawyer_id.errors" class="invalid-feedback">
                  <label *ngIf="f.lawyer_id.errors.required">Lawyer is required</label>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group row">
              <label class="col-sm-4">Case Stage <span class="error">*</span></label>
              <div class="col-sm-8">
                <select   formControlName="case_stage" >
                  <option value="">Select Case Stage</option>
                  <option *ngFor="let data of caseList" value="{{data.id}}">{{data.case_name}}</option>
                </select>
                <div class="col-md-12" *ngIf="submitted && f.case_stage.errors" class="invalid-feedback">
                  <label *ngIf="f.case_stage.errors.required">Case Stage is required</label>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="form-group row">
              <label class="col-sm-4">Cash Expense <span class="error">*</span></label>
              <div class="col-sm-8">
                <input #case_expense type="text" class="form-control px-2" placeholder="Enter Cash Expense" formControlName="case_expense">
                <div class="col-md-12" *ngIf="submitted && f.case_expense.errors" class="invalid-feedback">
                  <label *ngIf="f.case_expense.errors.required">Cash Expense is required</label>
                  <label *ngIf="f.case_expense.errors.pattern">Invalid format</label>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="form-group row">
              <label class="col-sm-4">Remarks</label>
              <div class="col-sm-8">
                <textarea #remarks class="form-control px-2" placeholder="Enter Remarks" rows="3" formControlName="remarks"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">&nbsp;</div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/suit-file-report']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
