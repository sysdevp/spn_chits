<div class="card mb-4">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold"> Delete Bank Detail</div>
      <div class="col-6 d-flex justify-content-end"> 
        <a [routerLink]="['/admin-panel/view-bank-details']" class="bg-sky border-0 text-white px-3 py-2 mx-2 "> <i class="fas fa-eye pr-2"></i>View Bank</a>
        <a [routerLink]="['/admin-panel/add-bank-details']"  class="bg-success border-0 text-white px-3 py-2"> + Add Bank</a>
      </div>   
    </div>
  </div>
  <div class="card-body">
    <form class="bs-example form-horizontal" [formGroup]="DeleteBank" (ngSubmit)="onSubmit()" >
      <div class="form-group row">
        <label for="inputEmail3" class="col-sm-2 col-form-label">Remarks</label>
        <div class="col-sm-10">
          <textarea class="form-control px-2" rows="3" placeholder="Remarks"  formControlName="deletion_remark"></textarea>
        </div>
      </div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1 " >{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-bank-details']" class="btn btn-danger mr-1 ">Cancel</a>
      </div> 	
    </form>
  </div>
</div>
