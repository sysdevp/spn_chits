<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Update Feedback Type</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-feed-back-type']"  class="bg-primary border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Feedback Types</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze ">
    <form class="bs-example form-horizontal" [formGroup]="UpdateFeedbackType" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-md-2 col-3 col-form-label">Feed Back <span class="error">*</span></label>
        <div class="col-sm-10 col-md-7 col-9">
          <input #remark_name type="text" class="form-control" placeholder="Enter Feed Back"  formControlName="remark_name">
          <div class="col-md-12" *ngIf="submitted && f.remark_name.errors" class="invalid-feedback">
            <label *ngIf="f.remark_name.errors.required">Feed Back is required</label>
            <label *ngIf="f.remark_name.errors.pattern">Characters only allowed</label>
          </div>
        </div>
      </div>
      <div class="form-group row ">
        <div class="offset-md-2 offset-sm-2 col-sm-10 col-md-7 col-12">
          <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
          <a [routerLink]="['/admin-panel/view-feed-back-type']" class="btn btn-danger mr-1">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
