<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-6 my-auto font-weight-bold">Update Auction Holidays</div>
            <div class="col-6 text-right">
                <a [routerLink]="['/admin-panel/view-auction-on-holidays']" class="bg-success border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Holidays</a>
            </div>
        </div>
    </div>
    <div class="card-body add-maze ">
        <form class="bs-example form-horizontal" [formGroup]="UpdateAuctionOnHolidays" (ngSubmit)="onSubmit()">
            <div class="form-group row" [hidden]="!isSuperAdmin">
                <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
                <div class="col-sm-10 col-md-7 col-9">
                    <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
                        <option value="">Select Company</option>
                        <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
                    </select>
                    <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
                        <label *ngIf="f.tenant_id.errors.required">Company is required</label>
                    </div>
                </div>
            </div>  
            <div class="form-group row">
                <label class="col-sm-2 col-md-2 col-3 col-form-label"> Branch <span class="error">*</span></label>
                <div class="col-sm-10 col-md-7 col-9">
                    <select #branch_id class="form-control form-control w-100 border-dark" formControlName="branch_id">
                        <option value="">Select Branch</option>
                        <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
                    </select>
                <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                    <label *ngIf="f.branch_id.errors.required">Branch name is required</label>
                    </div>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-md-2 col-3 col-form-label">Holiday Date <span class="error">*</span></label>
                <div class="col-sm-10 col-md-7 col-9">
                    <input #holiday_date type="text" class="form-control calendar" placeholder="Enter Holiday Date" formControlName="holiday_date" (click)="d1.toggle()" ngbDatepicker #d1="ngbDatepicker" onkeydown="return false">
                    <div class="col-md-12" *ngIf="submitted && f.holiday_date.errors" class="invalid-feedback">
                        <label *ngIf="f.holiday_date.errors.required">Holiday date is required</label>
                    </div>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-md-2 col-3 col-form-label">Event Name <span class="error">*</span></label>
                <div class="col-sm-10 col-md-7 col-9 w">
                    <input #event_name type="text" class="form-control" placeholder="Enter Event Name" formControlName="event_name">
                    <div class="col-md-12" *ngIf="submitted && f.event_name.errors" class="invalid-feedback">
                        <label *ngIf="f.event_name.errors.required">Event name is required</label>
                    </div>  
                </div>
            </div>
            <div class="form-group d-flex justify-content-center">
                <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
                <a [routerLink]="['/admin-panel/view-auction-on-holidays']" class="btn btn-danger mr-1">Cancel</a>
            </div> 
        </form>
    </div>
</div>
