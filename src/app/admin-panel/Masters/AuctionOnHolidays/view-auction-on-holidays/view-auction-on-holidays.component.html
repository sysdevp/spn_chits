<div class="card maz-vh">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Holiday List</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/add-auction-on-holidays']" class="bg-success border-0 text-white px-3 py-2"> + Add Holiday </a>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div [hidden]="TableHidden">
      <table id="dtable"  class="row-border hover">
        <thead>
          <tr> 
            <th>SNo</th>
            <th>Branch </th>
            <th>Holiday Date</th>
            <th>Event Name</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of dataList;">
            <td>{{row.sno}}</td>
            <td>{{row.branch_info.branch_name}}</td>
            <td>{{row.holiday_date}}</td>
            <td>{{row.event_name}}</td>
            <td>  
              <a [routerLink]="['/admin-panel/update-auction-on-holidays/'+row.id]"><i class="fas fa-edit text-primary mx-2"></i></a>
              <a [routerLink]="['/admin-panel/delete-auction-on-holidays/'+row.id]"><i class="fas fa-trash-alt text-danger"></i></a>
              <!--<a *ngIf="row.status==1" (click)="changeStatus(row.id,0)" style="margin-left:5%;cursor:pointer;" title="Deactivate Holiday"><i class="fas fa-check-circle text-success"></i></a>
              <a *ngIf="row.status==0" (click)="changeStatus(row.id,1)" style="margin-left:5%;cursor:pointer;" title="Activate Holiday"><i class="fas fa-ban text-danger"></i></a>-->
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div *ngIf="TableHidden==true" class="table-loader" > 
      <img style="width: 120px;margin: 20% auto;display: block;" src="assets/img/loading.gif"/>
    </div>
  </div>
</div>
