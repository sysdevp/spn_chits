<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Change Password</div>
        <div class="col-6 text-right">
          <a [routerLink]="['/admin-panel']"  class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> Back</a>
        </div>
    </div>
  </div>
  <div class="card-body add-maze ">
    <form class="bs-example form-horizontal" [formGroup]="PasswordChange" (ngSubmit)="onSubmit()">
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Old Password <span class="error">*</span></label>
        <div class="col-sm-4">
          <input #old_password type="text" *ngIf="showOldPassword" class="form-control px-2" placeholder="Enter Old Password" formControlName="old_password">
          <input #old_password type="password" *ngIf="!showOldPassword" class="form-control px-2" placeholder="Enter Old Password" formControlName="old_password">
          <div class="col-md-12" *ngIf="submitted && f.old_password.errors" class="invalid-feedback">
            <label *ngIf="f.old_password.errors.required">Old Password is required</label>
          </div> 
        </div>
        <div class="col-md-4" *ngIf="showOldPassword" (click)="showHidePassword('oldPassword',false);"><i class="fas fa-eye eye_hide"></i></div>
        <div class="col-md-4" *ngIf="!showOldPassword" (click)="showHidePassword('oldPassword',true);"><i class="fas fa-eye-slash eye_show"></i></div>
      </div> 
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">New Password <span class="error">*</span></label>
        <div class="col-sm-4">
          <input #new_password type="text" *ngIf="showPassword" class="form-control px-2" placeholder="Enter New Password" formControlName="new_password">
          <input #new_password type="password" *ngIf="!showPassword" class="form-control px-2" placeholder="Enter New Password" formControlName="new_password">
          <div class="col-md-12" *ngIf="submitted && f.new_password.errors" class="invalid-feedback">
            <label *ngIf="f.new_password.errors.required">New Password is required</label>
           <label *ngIf="f.new_password.errors?.required && f.new_password.touched">
  Password is required
</label>

<label *ngIf="f.new_password.errors?.minlength && f.new_password.touched">
  Password must be at least 8 characters
</label>

<label *ngIf="f.new_password.errors?.pattern && f.new_password.touched">
  Password must contain at least one uppercase letter, one lowercase letter, one number, and one special character
</label>
          </div> 
        </div>
        <div class="col-md-4" *ngIf="showPassword" (click)="showHidePassword('password',false);"><i class="fas fa-eye eye_hide"></i></div>
        <div class="col-md-4" *ngIf="!showPassword" (click)="showHidePassword('password',true);"><i class="fas fa-eye-slash eye_show"></i></div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Confirm Password <span class="error">*</span></label>
        <div class="col-sm-4">
          <input #confirm_password type="text" *ngIf="showConfirmPassword" class="form-control px-2" placeholder="Enter Confirm Password" formControlName="confirm_password" (blur)="onPwdChange($event)">
          <input #confirm_password type="password" *ngIf="!showConfirmPassword" class="form-control px-2" placeholder="Enter Confirm Password" formControlName="confirm_password" (blur)="onPwdChange($event)">
          <div class="col-md-12" *ngIf="submitted && f.confirm_password.errors" class="invalid-feedback">
            <label *ngIf="f.confirm_password.errors.required">Confirm password is required</label>
          </div> 
          <div class="col-md-12" *ngIf="ConfirmPasswordAlertMsg" class="invalid-feedback">
            <label>Confirm Password should  equal to  New Password</label>
          </div>
        </div>
        <div class="col-md-4" *ngIf="showConfirmPassword" (click)="showHidePassword('confirmPassword',false);"><i class="fas fa-eye eye_hide"></i></div>
        <div class="col-md-4" *ngIf="!showConfirmPassword" (click)="showHidePassword('confirmPassword',true);"><i class="fas fa-eye-slash eye_show"></i></div>
      </div>
      <div class="form-group d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel']" class="btn btn-danger mr-1">Cancel</a>
      </div> 
    </form>
  </div>
</div>
