<div class="card collection-area-mapping-card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">
        Update Collection Area Mapping
      </div>
      <div class="col-6 text-right">
        <a
          [routerLink]="['/admin-panel/view-collection-area-mapping']"
          class="bg-info border-0 text-white px-3 py-2"
        >
          <i class="fas fa-eye pr-2"></i> View Collection Area Mapping</a
        >
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form
      class="bs-example form-horizontal"
      [formGroup]="UpdateCollectionArea"
      (ngSubmit)="onSubmit()"
    >
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label"
          >Company Name <span class="error">*</span></label
        >
        <div class="col-sm-10">
          <select
            #tenant_id
            formControlName="tenant_id"
            (change)="companyChg($event)"
          >
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{ data.id }}">
              {{ data.chit_fund_name }}
            </option>
          </select>
          <div
            class="col-md-12"
            *ngIf="submitted && f.tenant_id.errors"
            class="invalid-feedback"
          >
            <label *ngIf="f.tenant_id.errors.required"
              >Company is required</label
            >
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4"
              >Branch <span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select
                #branch_id
                formControlName="branch_id"
                (change)="branchChg($event)"
              >
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{ data.id }}">
                  {{ data.branch_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.branch_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.branch_id.errors.required"
                  >Branch is required</label
                >
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4"
              >Employee<span class="error">*</span></label
            >
            <div class="col-sm-8">
              <select #employee_id formControlName="employee_id">
                <option value="">Select Employee</option>
                <option *ngFor="let data of employeeList" value="{{ data.id }}">
                  {{ data.first_name }}{{ data.last_name }}
                </option>
              </select>
              <div
                class="col-md-12"
                *ngIf="submitted && f.employee_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.employee_id.errors.required"
                  >Employee is required</label
                >
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4"
              >Collection Area<span class="error">*</span></label
            >
            <div class="col-sm-8 collection-area-multiselect">
              <ng-multiselect-dropdown
                [placeholder]="'Select Collection Area(s)'"
                [data]="dropdownList"
                formControlName="collection_area_id"
                [settings]="dropdownSettings"
              >
              </ng-multiselect-dropdown>
              <div
                class="col-md-12"
                *ngIf="submitted && f.collection_area_id.errors"
                class="invalid-feedback"
              >
                <label *ngIf="f.collection_area_id.errors.required"
                  >Collection Area is required</label
                >
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group d-flex justify-content-right">
        <button
          type="submit"
          class="btn btn-primary mr-1"
          [disabled]="disableBtn"
        >
          {{ SubmitbuttonName }}
        </button>
        <a
          [routerLink]="['/admin-panel/view-collection-area-mapping']"
          class="btn btn-danger mr-1"
          >Cancel</a
        >
      </div>
    </form>
  </div>
</div>
