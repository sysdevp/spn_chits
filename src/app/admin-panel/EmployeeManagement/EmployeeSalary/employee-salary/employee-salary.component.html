<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-6 my-auto font-weight-bold">Add Employee Salary</div>
      <div class="col-6 text-right">
        <a [routerLink]="['/admin-panel/view-employee-salary']" class="bg-info border-0 text-white px-3 py-2"> <i class="fas fa-eye pr-2"></i> View Employee Salary</a>
      </div>
    </div>
  </div>
  <div class="card-body add-maze">
    <form class="bs-example form-horizontal" [formGroup]="AddEmployeeSalary" (ngSubmit)="onSubmit()">
      <div class="form-group row" [hidden]="!isSuperAdmin">
        <label class="col-sm-2 col-form-label">Company Name <span class="error">*</span></label>
        <div class="col-sm-10">
          <select #tenant_id formControlName="tenant_id" (change)="companyChg($event)">
            <option value="">Select Company</option>
            <option *ngFor="let data of companyList" value="{{data.id}}">{{data.chit_fund_name}}</option>
          </select>
          <div class="col-md-12" *ngIf="submitted && f.tenant_id.errors" class="invalid-feedback">
            <label *ngIf="f.tenant_id.errors.required">Company is required</label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Branch <span class="error">*</span></label>
            <div class="col-sm-8">  
              <select #branch_id formControlName="branch_id" (change)="branchChg($event)">
                <option value="">Select Branch</option>
                <option *ngFor="let data of branchList" value="{{data.id}}">{{data.branch_name}}</option>
              </select>
              <div class="col-md-12" *ngIf="submitted && f.branch_id.errors" class="invalid-feedback">
                <label *ngIf="f.branch_id.errors.required">Branch is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4">Salary Month <span class="error">*</span> </label>
            <div class="col-sm-8">
              <input #month_year type="text" class="form-control col-sm-12" placeholder="Month & Year" formControlName="month_year"  (click)="d1.toggle()" ngbDatepicker #d1="ngbDatepicker" onkeydown="return false" disabled>
              <div class="col-md-12" *ngIf="submitted && f.month_year.errors" class="invalid-feedback">
                <label *ngIf="f.month_year.errors.required">Salary Month is required</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group row">
            <label class="col-sm-4">Working Days <span class="error">*</span> </label>
            <div class="col-sm-8">
              <input #working_days type="text" class="form-control col-sm-12" placeholder="Working Days" formControlName="working_days" >
              <div class="col-md-12" *ngIf="submitted && f.working_days.errors" class="invalid-feedback">
                <label *ngIf="f.working_days.errors.required">Working Days is required</label>
                <label *ngIf="f.working_days.errors.pattern">Invalid format</label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">&nbsp;</div>
      <div class="row border emp_hrm">
        <h5 class="col-md-10 py-2">Salary Details</h5>
        <table class="table table-striped" >
          <thead>
            <tr>
              <th scope="col">Employee Name</th>
              <th scope="col">Basic Salary</th>
            </tr>
          </thead>
          <tbody formArrayName="Employees">
            <tr *ngFor="let emp of Employees['controls']; let i=index;" formGroupName="{{i}}">
              <td>
                <input type="text" class="form-control" formControlName="emp_name" readonly>
              </td>
              <td>
                <input  type="text" class="form-control" formControlName="salary" (change)="salaryChg(i)">
                <div class="col-md-12" *ngIf="submitted && emp.controls.salary.errors" class="invalid-feedback">
                  <label *ngIf="emp.hasError('required', 'salary')">Basic Salary is required</label>
                  <label *ngIf="emp.hasError('pattern', 'salary')">Invalid Format</label>
                </div>
              </td>
            </tr>
          </tbody>
        </table> 
      </div> 
      <div class="row">&nbsp;</div>
      <div class="form-group row d-flex justify-content-center">
        <button type="submit" class="btn btn-primary mr-1" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
        <a [routerLink]="['/admin-panel/view-employee-salary']" class="btn btn-danger mr-1">Cancel</a>
      </div>
    </form>
  </div>
</div>
