<div class="hr-panel">
  <div class="hr-panel-head">
    <div>
      <h3>Assign Employee Task</h3>
      <p>Create daily tasks and track completion status</p>
    </div>
    <div class="hr-actions">
      <a [routerLink]="['/admin-panel/view-daily-tasks-targets']" class="btn btn-light btn-sm">
        <i class="fas fa-eye pr-1"></i> View Status
      </a>
      <a [routerLink]="['/admin-panel/set-employee-target']" class="btn btn-warning btn-sm">
        <i class="fas fa-bullseye pr-1"></i> Set Targets
      </a>
    </div>
  </div>

  <form class="hr-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-row" *ngIf="isSuperAdmin">
      <div class="form-group col-md-4">
        <label>Company <span class="error">*</span></label>
        <select class="form-control" formControlName="tenant_id" (change)="companyChg($event)">
          <option value="">Select Company</option>
          <option *ngFor="let data of companyList" [value]="data.id">{{data.chit_fund_name}}</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group col-md-4">
        <label>Branch <span class="error">*</span></label>
        <select class="form-control" formControlName="branch_id" (change)="branchChg($event)">
          <option value="">Select Branch</option>
          <option *ngFor="let data of branchList" [value]="data.id">{{data.branch_name}}</option>
        </select>
      </div>
      <div class="form-group col-md-4">
        <label>Employee <span class="error">*</span></label>
        <select class="form-control" formControlName="employee_id" (change)="loadTasks()">
          <option value="">Select Employee</option>
          <option *ngFor="let emp of employeeList" [value]="emp.id">{{emp.first_name}} {{emp.last_name}}</option>
        </select>
      </div>
      <div class="form-group col-md-4">
        <label>Priority</label>
        <select class="form-control" formControlName="priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group col-md-4">
        <label>Task Date <span class="error">*</span></label>
        <input type="date" class="form-control" formControlName="task_date">
      </div>
      <div class="form-group col-md-4">
        <label>Due Date</label>
        <input type="date" class="form-control" formControlName="due_date">
      </div>
      <div class="form-group col-md-4">
        <label>Title <span class="error">*</span></label>
        <input type="text" class="form-control" formControlName="title" placeholder="Task title">
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea class="form-control" rows="3" formControlName="description" placeholder="Task details"></textarea>
    </div>
    <div class="hr-form-actions">
      <button type="submit" class="btn btn-success" [disabled]="disableBtn">{{SubmitbuttonName}}</button>
      <button type="button" class="btn btn-outline-secondary" (click)="loadTasks()">Refresh List</button>
    </div>
  </form>

  <div class="hr-table-wrap" [hidden]="TableHidden">
    <h5 class="mb-2">Assigned Tasks</h5>
    <div class="table-responsive">
      <table class="table hr-table mb-0">
        <thead>
          <tr>
            <th>#</th>
            <th>Employee</th>
            <th>Title</th>
            <th>Date</th>
            <th>Priority</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of taskList; let i = index">
            <td>{{i + 1}}</td>
            <td>{{row.employee_name}}</td>
            <td>{{row.title}}</td>
            <td>{{row.task_date}}</td>
            <td><span class="hr-chip">{{row.priority}}</span></td>
            <td><span class="hr-chip status">{{row.task_status}}</span></td>
            <td>
              <button type="button" class="btn btn-sm btn-outline-danger" (click)="deleteTask(row)">Delete</button>
            </td>
          </tr>
          <tr *ngIf="!taskList.length">
            <td colspan="7" class="text-center text-muted py-4">No tasks found</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
